<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PythonCamp — Бесплатный курс Python</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a23;
    --bg2: #1b1b32;
    --bg3: #2a2a40;
    --text: #dfdfe2;
    --muted: #858591;
    --accent: #f1be32;
    --green: #acd157;
    --blue: #3b9eff;
    --red: #ff6b6b;
    --border: #3b3b4f;
  }
  body {
    font-family: 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }
  header {
    background: var(--bg2);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid var(--accent);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 22px;
    font-weight: bold;
    color: var(--accent);
  }
  .logo-icon {
    width: 40px;
    height: 40px;
    background: var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 14px;
  }
  .progress-bar {
    width: 200px;
    height: 8px;
    background: var(--bg3);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--green), var(--accent));
    transition: width 0.4s;
  }
  .container {
    display: grid;
    grid-template-columns: 280px 1fr;
    min-height: calc(100vh - 66px);
  }
  aside {
    background: var(--bg2);
    border-right: 1px solid var(--border);
    padding: 20px 0;
    overflow-y: auto;
    max-height: calc(100vh - 66px);
    position: sticky;
    top: 66px;
  }
  .menu-title {
    padding: 0 20px 12px;
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .lesson-item {
    padding: 12px 20px;
    cursor: pointer;
    border-left: 3px solid transparent;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: all 0.2s;
    font-size: 14px;
  }
  .lesson-item:hover {
    background: var(--bg3);
  }
  .lesson-item.active {
    background: var(--bg3);
    border-left-color: var(--accent);
    color: var(--accent);
  }
  .lesson-item.completed .lesson-check {
    color: var(--green);
  }
  .lesson-check {
    width: 18px;
    height: 18px;
    border: 2px solid var(--muted);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    flex-shrink: 0;
  }
  .lesson-item.completed .lesson-check {
    border-color: var(--green);
    background: var(--green);
    color: var(--bg);
  }
  main {
    padding: 32px 40px;
    max-width: 1000px;
  }
  .lesson-header {
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .lesson-number {
    color: var(--muted);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  h1 {
    font-size: 32px;
    color: var(--accent);
    margin-top: 4px;
  }
  .lesson-content h2 {
    color: var(--blue);
    margin: 24px 0 12px;
    font-size: 22px;
  }
  .lesson-content h3 {
    color: var(--green);
    margin: 18px 0 10px;
    font-size: 18px;
  }
  .lesson-content p {
    margin-bottom: 12px;
    color: var(--text);
  }
  .lesson-content ul, .lesson-content ol {
    margin: 10px 0 16px 24px;
  }
  .lesson-content li {
    margin-bottom: 6px;
  }
  .lesson-content code {
    background: var(--bg3);
    padding: 2px 8px;
    border-radius: 4px;
    color: var(--accent);
    font-family: 'Consolas', monospace;
    font-size: 14px;
  }
  .code-block {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin: 14px 0;
    overflow: hidden;
  }
  .code-block-header {
    background: var(--bg3);
    padding: 8px 14px;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .code-block pre {
    padding: 14px;
    overflow-x: auto;
    font-family: 'Consolas', monospace;
    font-size: 14px;
    line-height: 1.5;
  }
  .code-block code {
    background: none;
    padding: 0;
    color: var(--text);
  }
  .kw { color: #c678dd; }
  .str { color: #98c379; }
  .num { color: #d19a66; }
  .com { color: #5c6370; font-style: italic; }
  .fn { color: #61afef; }
  .bi { color: #e5c07b; }
  .task-box {
    background: linear-gradient(135deg, rgba(241,190,50,0.1), rgba(172,209,87,0.05));
    border: 2px solid var(--accent);
    border-radius: 8px;
    padding: 20px;
    margin: 24px 0;
  }
  .task-box h3 {
    color: var(--accent);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .task-box p {
    margin-bottom: 10px;
  }
  .editor-container {
    margin-top: 16px;
  }
  .editor-header {
    background: var(--bg3);
    padding: 8px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-radius: 6px 6px 0 0;
    border: 1px solid var(--border);
    border-bottom: none;
  }
  .editor-title {
    color: var(--muted);
    font-size: 13px;
  }
  .editor-buttons {
    display: flex;
    gap: 8px;
  }
  textarea.editor {
    width: 100%;
    min-height: 180px;
    background: #0d0d1f;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 0 0 6px 6px;
    padding: 14px;
    font-family: 'Consolas', monospace;
    font-size: 14px;
    line-height: 1.5;
    resize: vertical;
    outline: none;
    tab-size: 4;
  }
  textarea.editor:focus {
    border-color: var(--accent);
  }
  .btn {
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    font-size: 13px;
    transition: all 0.2s;
  }
  .btn:hover {
    background: #f5cb42;
    transform: translateY(-1px);
  }
  .btn-secondary {
    background: var(--bg3);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover {
    background: var(--border);
  }
  .btn-success {
    background: var(--green);
  }
  .btn-success:hover {
    background: #bcd66a;
  }
  .output-box {
    margin-top: 12px;
    background: #000;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    font-family: 'Consolas', monospace;
    font-size: 13px;
    min-height: 60px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .output-box.success {
    border-color: var(--green);
    color: var(--green);
  }
  .output-box.error {
    border-color: var(--red);
    color: var(--red);
  }
  .output-label {
    font-size: 12px;
    color: var(--muted);
    margin-top: 12px;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .nav-buttons {
    display: flex;
    justify-content: space-between;
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .welcome-screen {
    text-align: center;
    padding: 60px 20px;
  }
  .welcome-screen h1 {
    font-size: 48px;
    margin-bottom: 20px;
  }
  .welcome-screen p {
    font-size: 18px;
    color: var(--muted);
    margin-bottom: 30px;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
  }
  .feature-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    margin: 40px 0;
  }
  .feature {
    background: var(--bg2);
    padding: 20px;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .feature-icon {
    font-size: 32px;
    margin-bottom: 10px;
  }
  .feature h3 {
    color: var(--accent);
    margin-bottom: 8px;
  }
  .certificate {
    background: linear-gradient(135deg, var(--bg2), var(--bg3));
    border: 3px solid var(--accent);
    border-radius: 12px;
    padding: 40px;
    text-align: center;
    margin: 20px 0;
  }
  .certificate h2 {
    color: var(--accent);
    font-size: 36px;
    margin-bottom: 10px;
  }
  .certificate .cert-name {
    font-size: 28px;
    color: var(--green);
    margin: 20px 0;
  }
  .loading-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(10,10,35,0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  .spinner {
    width: 50px;
    height: 50px;
    border: 4px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .hint-box {
    background: rgba(59,158,255,0.1);
    border-left: 3px solid var(--blue);
    padding: 12px 16px;
    margin: 12px 0;
    border-radius: 4px;
  }
  .hint-box strong {
    color: var(--blue);
  }
  @media (max-width: 768px) {
    .container { grid-template-columns: 1fr; }
    aside {
      position: relative;
      top: 0;
      max-height: none;
    }
    main { padding: 20px; }
    h1 { font-size: 24px; }
    .progress-bar { width: 100px; }
  }
  aside::-webkit-scrollbar, .code-block pre::-webkit-scrollbar {
    width: 8px; height: 8px;
  }
  aside::-webkit-scrollbar-track, .code-block pre::-webkit-scrollbar-track {
    background: var(--bg);
  }
  aside::-webkit-scrollbar-thumb, .code-block pre::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 4px;
  }
</style>
</head>
<body>

<div id="loading" class="loading-overlay">
  <div class="spinner"></div>
  <p style="margin-top:20px; color: var(--accent);">Загружаем Python в браузере...</p>
  <p style="margin-top:8px; color: var(--muted); font-size:13px;">Первый запуск может занять до 30 секунд</p>
</div>

<header>
  <div class="logo">
    <div class="logo-icon">🐍</div>
    <div>PythonCamp</div>
  </div>
  <div class="header-right">
    <span id="progressText">0 / 18 уроков</span>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width: 0%"></div>
    </div>
  </div>
</header>

<div class="container">
  <aside id="sidebar">
    <div class="menu-title">Учебный план</div>
    <div id="lessonList"></div>
  </aside>
  <main id="mainContent"></main>
</div>

<script>
// ============ ДАННЫЕ УРОКОВ ============
const lessons = [
  {
    id: 0,
    title: "Добро пожаловать",
    content: `
      <div class="welcome-screen">
        <h1>🐍 Изучите Python бесплатно</h1>
        <p>Полный интерактивный курс по Python с выполнением кода прямо в браузере. От основ до продвинутых тем.</p>
        <div class="feature-grid">
          <div class="feature">
            <div class="feature-icon">💻</div>
            <h3>Реальный Python</h3>
            <p>Код выполняется в браузере через Pyodide — настоящий Python 3.11</p>
          </div>
          <div class="feature">
            <div class="feature-icon">📚</div>
            <h3>18 уроков</h3>
            <p>От переменных до ООП, декораторов и генераторов</p>
          </div>
          <div class="feature">
            <div class="feature-icon">🎯</div>
            <h3>Практика</h3>
            <p>Задачи с автоматической проверкой после каждого урока</p>
          </div>
          <div class="feature">
            <div class="feature-icon">🏆</div>
            <h3>Сертификат</h3>
            <p>Получите сертификат после прохождения всех уроков</p>
          </div>
        </div>
        <button class="btn" onclick="goToLesson(1)" style="font-size:18px; padding:14px 32px;">Начать обучение →</button>
      </div>
    `
  },
  {
    id: 1,
    title: "1. Первая программа",
    content: `
      <div class="lesson-header">
        <div class="lesson-number">Урок 1 из 17</div>
        <h1>Ваша первая программа на Python</h1>
      </div>
      <div class="lesson-content">
        <p>Python — один из самых популярных языков программирования. Его создатель, Гвидо ван Россум, назвал язык в честь шоу "Monty Python's Flying Circus".</p>
        <h2>Функция print()</h2>
        <p>Чтобы вывести текст на экран, используется функция <code>print()</code>:</p>
        <div class="code-block">
          <div class="code-block-header"><span>Python</span></div>
          <pre><code><span class="fn">print</span>(<span class="str">"Привет, мир!"</span>)
<span class="fn">print</span>(<span class="str">"Я учу Python"</span>)</code></pre>
        </div>
        <h2>Комментарии</h2>
        <p>Комментарии начинаются с символа <code>#</code> и игнорируются интерпретатором:</p>
        <div class="code-block">
          <pre><code><span class="com"># Это комментарий</span>
<span class="fn">print</span>(<span class="str">"Это код"</span>)  <span class="com"># А это комментарий в конце строки</span></code></pre>
        </div>
        <div class="task-box">
          <h3>🎯 Задание</h3>
          <p>Выведите на экран фразу <strong>"Hello, Python!"</strong> (именно так, с большой буквы H и P).</p>
          <div class="editor-container">
            <div class="editor-header">
              <span class="editor-title">Редактор кода</span>
              <div class="editor-buttons">
                <button class="btn btn-secondary" onclick="resetCode(1)">Сбросить</button>
                <button class="btn" onclick="runCode(1)">▶ Запустить</button>
              </div>
            </div>
            <textarea class="editor" id="editor-1"># Напишите ваш код здесь
</textarea>
          </div>
          <div class="output-label">Вывод:</div>
          <div class="output-box" id="output-1">Нажмите "Запустить"</div>
        </div>
      </div>
    `,
    starterCode: "# Напишите ваш код здесь\n",
    check: (stdout) => stdout.trim() === "Hello, Python!"
  },
  {
    id: 2,
    title: "2. Переменные и типы",
    content: `
      <div class="lesson-header">
        <div class="lesson-number">Урок 2 из 17</div>
        <h1>Переменные и типы данных</h1>
      </div>
      <div class="lesson-content">
        <p>Переменная — это именованная ячейка памяти. В Python не нужно указывать тип переменной — он определяется автоматически.</p>
        <h2>Создание переменных</h2>
        <div class="code-block">
          <pre><code>name = <span class="str">"Алиса"</span>      <span class="com"># строка (str)</span>
age = <span class="num">25</span>              <span class="com"># целое число (int)</span>
height = <span class="num">1.68</span>         <span class="com"># дробное число (float)</span>
is_student = <span class="kw">True</span>     <span class="com"># логический тип (bool)</span></code></pre>
        </div>
        <h2>Основные типы данных</h2>
        <ul>
          <li><code>int</code> — целые числа: <code>42</code>, <code>-7</code></li>
          <li><code>float</code> — дробные числа: <code>3.14</code>, <code>-0.5</code></li>
          <li><code>str</code> — строки: <code>"привет"</code></li>
          <li><code>bool</code> — логические: <code>True</code> или <code>False</code></li>
        </ul>
        <h2>Функция type()</h2>
        <p>Узнать тип переменной можно с помощью <code>type()</code>:</p>
        <div class="code-block">
          <pre><code>x = <span class="num">10</span>
<span class="fn">print</span>(<span class="fn">type</span>(x))  <span class="com"># &lt;class 'int'&gt;</span></code></pre>
        </div>
        <div class="task-box">
          <h3>🎯 Задание</h3>
          <p>Создайте переменную <code>year</code> со значением <strong>2026</strong> и выведите её на экран.</p>
          <div class="editor-container">
            <div class="editor-header">
              <span class="editor-title">Редактор кода</span>
              <div class="editor-buttons">
                <button class="btn btn-secondary" onclick="resetCode(2)">Сбросить</button>
                <button class="btn" onclick="runCode(2)">▶ Запустить</button>
              </div>
            </div>
            <textarea class="editor" id="editor-2"></textarea>
          </div>
          <div class="output-label">Вывод:</div>
          <div class="output-box" id="output-2">Нажмите "Запустить"</div>
        </div>
      </div>
    `,
    starterCode: "# Создайте переменную year со значением 2026\n# и выведите её на экран\n",
    check: (stdout) => stdout.trim() === "2026"
  },
  {
    id: 3,
    title: "3. Операторы",
    content: `
      <div class="lesson-header">
        <div class="lesson-number">Урок 3 из 17</div>
        <h1>Арифметические операторы</h1>
      </div>
      <div class="lesson-content">
        <p>Python поддерживает все стандартные математические операции:</p>
        <div class="code-block">
          <pre><code>a = <span class="num">10</span>
b = <span class="num">3</span>

<span class="fn">print</span>(a + b)   <span class="com"># Сложение: 13</span>
<span class="fn">print</span>(a - b)   <span class="com"># Вычитание: 7</span>
<span class="fn">print</span>(a * b)   <span class="com"># Умножение: 30</span>
<span class="fn">print</span>(a / b)   <span class="com"># Деление: 3.333...</span>
<span class="fn">print</span>(a // b)  <span class="com"># Целочисленное деление: 3</span>
<span class="fn">print</span>(a % b)   <span class="com"># Остаток от деления: 1</span>
<span class="fn">print</span>(a ** b)  <span class="com"># Возведение в степень: 1000</span></code></pre>
        </div>
        <h2>Приоритет операций</h2>
        <p>Как в математике: сначала <code>**</code>, потом <code>* / // %</code>, затем <code>+ -</code>. Скобки меняют порядок:</p>
        <div class="code-block">
          <pre><code><span class="fn">print</span>(<span class="num">2</span> + <span class="num">3</span> * <span class="num">4</span>)      <span class="com"># 14</span>
<span class="fn">print</span>((<span class="num">2</span> + <span class="num">3</span>) * <span class="num">4</span>)    <span class="com"># 20</span></code></pre>
        </div>
        <div class="task-box">
          <h3>🎯 Задание</h3>
          <p>Вычислите и выведите результат: <strong>17 в степени 2</strong> (используйте оператор <code>**</code>).</p>
          <div class="editor-container">
            <div class="editor-header">
              <span class="editor-title">Редактор кода</span>
              <div class="editor-buttons">
                <button class="btn btn-secondary" onclick="resetCode(3)">Сбросить</button>
                <button class="btn" onclick="runCode(3)">▶ Запустить</button>
              </div>
            </div>
            <textarea class="editor" id="editor-3"></textarea>
          </div>
          <div class="output-label">Вывод:</div>
          <div class="output-box" id="output-3">Нажмите "Запустить"</div>
        </div>
      </div>
    `,
    starterCode: "# Выведите результат 17 ** 2\n",
    check: (stdout) => stdout.trim() === "289"
  },
  {
    id: 4,
    title: "4. Строки",
    content: `
      <div class="lesson-header">
        <div class="lesson-number">Урок 4 из 17</div>
        <h1>Работа со строками</h1>
      </div>
      <div class="lesson-content">
        <p>Строки — это последовательности символов. Их можно создавать в одинарных или двойных кавычках:</p>

// ============ СОСТОЯНИЕ ПРИЛОЖЕНИЯ ============
let pyodide = null;
let currentLesson = 0;
let completedLessons = new Set(JSON.parse(localStorage.getItem('pythoncamp_completed') || '[]'));
let savedCode = JSON.parse(localStorage.getItem('pythoncamp_code') || '{}');

// ============ ИНИЦИАЛИЗАЦИЯ PYODIDE ============
async function initPyodide() {
  try {
    pyodide = await loadPyodide();
    document.getElementById('loading').style.display = 'none';
    renderSidebar();
    renderLesson(currentLesson);
    updateProgress();
  } catch (e) {
    document.getElementById('loading').innerHTML = `
      <p style="color: var(--red);">❌ Ошибка загрузки Python</p>
      <p style="color: var(--muted); font-size:13px; margin-top:10px;">${e.message}</p>
      <button class="btn" onclick="location.reload()" style="margin-top:20px;">Попробовать снова</button>
    `;
  }
}

// ============ ПОДСВЕТКА СИНТАКСИСА ============
function highlightPython(code) {
  // Экранируем HTML
  let html = code
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
  
  // Комментарии
  html = html.replace(/(#[^\n]*)/g, '<span class="com">$1</span>');
  // Строки (двойные и одинарные кавычки)
  html = html.replace(/("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')/g, '<span class="str">$1</span>');
  // Числа
  html = html.replace(/\b(\d+\.?\d*)\b/g, '<span class="num">$1</span>');
  // Ключевые слова
  const keywords = ['def', 'class', 'if', 'elif', 'else', 'for', 'while', 'return', 'import', 'from', 'as', 'try', 'except', 'finally', 'raise', 'with', 'yield', 'lambda', 'pass', 'break', 'continue', 'and', 'or', 'not', 'in', 'is', 'True', 'False', 'None', 'del', 'global', 'nonlocal'];
  keywords.forEach(kw => {
    html = html.replace(new RegExp(`\\b(${kw})\\b`, 'g'), '<span class="kw">$1</span>');
  });
  // Встроенные функции
  const builtins = ['print', 'len', 'range', 'int', 'str', 'float', 'list', 'dict', 'set', 'tuple', 'type', 'input', 'sum', 'min', 'max', 'abs', 'round', 'sorted', 'enumerate', 'zip', 'map', 'filter', 'open', 'super', 'isinstance'];
  builtins.forEach(fn => {
    html = html.replace(new RegExp(`\\b(${fn})(?=\\()`, 'g'), '<span class="bi">$1</span>');
  });
  return html;
}

function highlightAllCodeBlocks() {
  document.querySelectorAll('.code-block pre code').forEach(block => {
    const raw = block.textContent;
    block.innerHTML = highlightPython(raw);
  });
}

// ============ РЕНДЕРИНГ ============
function renderSidebar() {
  const list = document.getElementById('lessonList');
  list.innerHTML = lessons.map(lesson => {
    const isActive = lesson.id === currentLesson;
    const isCompleted = completedLessons.has(lesson.id);
    return `
      <div class="lesson-item ${isActive ? 'active' : ''} ${isCompleted ? 'completed' : ''}" 
           onclick="goToLesson(${lesson.id})">
        <div class="lesson-check">${isCompleted ? '✓' : ''}</div>
        <div>${lesson.title}</div>
      </div>
    `;
  }).join('');
}

function renderLesson(id) {
  currentLesson = id;
  const lesson = lessons[id];
  const main = document.getElementById('mainContent');
  
  main.innerHTML = lesson.content;
  
  // Если есть редактор — вставляем сохранённый код
  const editor = document.getElementById(`editor-${id}`);
  if (editor) {
    editor.value = savedCode[id] !== undefined ? savedCode[id] : (lesson.starterCode || '');
    editor.addEventListener('input', () => {
      savedCode[id] = editor.value;
      localStorage.setItem('pythoncamp_code', JSON.stringify(savedCode));
    });
    // Поддержка Tab
    editor.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        editor.value = editor.value.substring(0, start) + '    ' + editor.value.substring(end);
        editor.selectionStart = editor.selectionEnd = start + 4;
      }
    });
  }
  
  highlightAllCodeBlocks();
  renderSidebar();
  window.scrollTo(0, 0);
}

function goToLesson(id) {
  renderLesson(id);
}

function resetCode(id) {
  const lesson = lessons[id];
  const editor = document.getElementById(`editor-${id}`);
  if (editor) {
    editor.value = lesson.starterCode || '';
    savedCode[id] = editor.value;
    localStorage.setItem('pythoncamp_code', JSON.stringify(savedCode));
  }
  const output = document.getElementById(`output-${id}`);
  if (output) {
    output.textContent = 'Нажмите "Запустить"';
    output.className = 'output-box';
  }
}

// ============ ВЫПОЛНЕНИЕ КОДА ============
async function runCode(id) {
  const editor = document.getElementById(`editor-${id}`);
  const output = document.getElementById(`output-${id}`);
  const lesson = lessons[id];
  const code = editor.value;
  
  output.textContent = '⏳ Выполняется...';
  output.className = 'output-box';
  
  try {
    // Перехват stdout
    pyodide.runPython(`
import sys
from io import StringIO
_stdout_capture = StringIO()
sys.stdout = _stdout_capture
_stderr_capture = StringIO()
sys.stderr = _stderr_capture
`);
    
    // Выполняем код пользователя
    await pyodide.runPythonAsync(code);
    
    // Получаем результат
    const stdout = pyodide.runPython('_stdout_capture.getvalue()');
    const stderr = pyodide.runPython('_stderr_capture.getvalue()');
    
    // Восстанавливаем stdout
    pyodide.runPython(`
import sys
sys.stdout = sys.__stdout__
sys.stderr = sys.__stderr__
`);
    
    if (stderr) {
      output.textContent = '⚠️ Предупреждения:\n' + stderr;
      output.className = 'output-box error';
      return;
    }
    
    output.textContent = stdout || '(нет вывода)';
    
    // Проверяем задание
    if (lesson.check) {
      const passed = lesson.check(stdout);
      if (passed) {
        completedLessons.add(id);
        localStorage.setItem('pythoncamp_completed', JSON.stringify([...completedLessons]));
        output.textContent += '\n\n✅ Отлично! Задание выполнено верно!';
        output.className = 'output-box success';
        renderSidebar();
        updateProgress();
        
        if (lesson.isFinal) {
          setTimeout(() => showCertificate(), 1500);
        } else if (id < lessons.length - 1) {
          setTimeout(() => {
            if (confirm('✅ Задание выполнено! Перейти к следующему уроку?')) {
              goToLesson(id + 1);
            }
          }, 1000);
        }
      } else {
        output.textContent += '\n\n❌ Неверный результат. Попробуйте ещё раз.';
        output.className = 'output-box error';
      }
    }
  } catch (e) {
    pyodide.runPython(`
import sys
sys.stdout = sys.__stdout__
sys.stderr = sys.__stderr__
`);
    output.textContent = '❌ Ошибка:\n' + e.message;
    output.className = 'output-box error';
  }
}

// ============ ПРОГРЕСС ============
function updateProgress() {
  const total = lessons.length - 1; // без welcome
  const done = completedLessons.size;
  const percent = (done / total) * 100;
  document.getElementById('progressFill').style.width = percent + '%';
  document.getElementById('progressText').textContent = `${done} / ${total} уроков`;
}

// ============ СЕРТИФИКАТ ============
function showCertificate() {
  const main = document.getElementById('mainContent');
  const date = new Date().toLocaleDateString('ru-RU', { 
    year: 'numeric', month: 'long', day: 'numeric' 
  });
  main.innerHTML = `
    <div class="certificate">
      <div style="font-size:64px; margin-bottom:10px;">🏆</div>
      <h2>СЕРТИФИКАТ</h2>
      <p style="color: var(--muted); font-size:14px;">о прохождении курса</p>
      <div style="font-size:24px; margin:20px 0; color: var(--text);">"Полный курс Python"</div>
      <div class="cert-name">🎓 Python Developer</div>
      <p style="color: var(--muted);">Успешно завершил(а) все 17 уроков</p>
      <p style="color: var(--muted); margin-top:20px; font-size:14px;">Дата выдачи: ${date}</p>
      <p style="color: var(--muted); font-size:12px; margin-top:10px;">PythonCamp © 2026</p>
      <div style="margin-top:30px; display:flex; gap:10px; justify-content:center;">
        <button class="btn" onclick="goToLesson(0)">← На главную</button>
        <button class="btn btn-secondary" onclick="resetProgress()">Сбросить прогресс</button>
      </div>
    </div>
  `;
}

function resetProgress() {
  if (confirm('Вы уверены? Весь прогресс будет удалён.')) {
    localStorage.removeItem('pythoncamp_completed');
    localStorage.removeItem('pythoncamp_code');
    completedLessons = new Set();
    savedCode = {};
    goToLesson(0);
    updateProgress();
  }
}

// ============ СТАРТ ============
initPyodide();
</script>
