ли прошло больше суток — <code>\" (N days later)\"<\/code>: <code>\"12:03 AM Thursday (2 days later)\"<\/code>.<\/li>\n<li>Порядок дней: Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday.<\/li>\n<\/ul>\n<h3>Примеры (ожидаемые результаты)<\/h3>\n<pre><code>add_time(\"3:00 PM\", \"3:10\")                 # \"6:10 PM\"\nadd_time(\"11:30 AM\", \"4:35\", \"Tuesday\")     # \"4:05 PM Tuesday\"\nadd_time(\"11:43 AM\", \"00:20\")               # \"12:03 PM\"\nadd_time(\"10:10 PM\", \"3:30\")                # \"1:40 AM (next day)\"\nadd_time(\"11:43 PM\", \"24:20\", \"Tuesday\")    # \"12:03 AM Thursday (2 days later)\"\nadd_time(\"6:30 PM\", \"205:12\")               # \"7:42 AM (9 days later)\"<\/code><\/pre>\n<div class=\"task\"><h4>🎯 Задание<\/h4><p>Реализуйте <code>add_time<\/code> так, чтобы пройти все 6 тестов. Подсказка по алгоритму: переведите всё в минуты от полуночи, сложите, выделите целые сутки и остаток, затем соберите строку результата.<\/p><\/div>\n", "seed": "def add_time(start, duration, day=None):\n    # Ваш код здесь\n    pass\n", "hint": "<p>1) Разберите start: <code>s_time, s_period = start.split()<\/code>, часы/минуты через <code>map(int, s_time.split(\":\"))<\/code>. 2) Если PM — добавьте 12*60 минут (кроме 12 PM, но формула <code>h % 12<\/code> это учтёт, если использовать 24-часовой пересчёт). 3) <code>days = total // 1440<\/code>. 4) Час в 12-формате: <code>h12 = h % 12 or 12<\/code>. 5) Минуты: <code>f\"{m:02d}\"<\/code>. 6) День недели: индекс в списке дней по <code>day.capitalize()<\/code>, плюс <code>days<\/code>, по модулю 7.<\/p>", "solution": "def add_time(start, duration, day=None):\n    DAYS = [\"Monday\", \"Tuesday\", \"Wednesday\", \"Thursday\",\n            \"Friday\", \"Saturday\", \"Sunday\"]\n    s_time, s_period = start.split()\n    s_h, s_m = map(int, s_time.split(\":\"))\n    d_h, d_m = map(int, duration.split(\":\"))\n    total = s_h * 60 + s_m + d_h * 60 + d_m\n    if s_period == \"PM\":\n        total += 12 * 60\n    days = total // 1440\n    rem = total % 1440\n    h, m = rem // 60, rem % 60\n    period = \"AM\" if h < 12 else \"PM\"\n    h12 = h % 12 or 12\n    result = f\"{h12}:{m:02d} {period}\"\n    if day:\n        idx = DAYS.index(day.capitalize())\n        result += f\" {DAYS[(idx + days) % 7]}\"\n    if days == 1:\n        result += \" (next day)\"\n    elif days > 1:\n        result += f\" ({days} days later)\"\n    return result", "tests": [{"t": "call", "fn": "add_time", "args": ["3:00 PM", "3:10"], "expect": "6:10 PM", "text": "add_time(\"3:00 PM\", \"3:10\") → \"6:10 PM\"", "static": "def\\s+add_time"}, {"t": "call", "fn": "add_time", "args": ["11:30 AM", "4:35", "Tuesday"], "expect": "4:05 PM Tuesday", "text": "add_time(\"11:30 AM\", \"4:35\", \"Tuesday\") → \"4:05 PM Tuesday\""}, {"t": "call", "fn": "add_time", "args": ["11:43 AM", "00:20"], "expect": "12:03 PM", "text": "add_time(\"11:43 AM\", \"00:20\") → \"12:03 PM\" (полдень)"}, {"t": "call", "fn": "add_time", "args": ["10:10 PM", "3:30"], "expect": "1:40 AM (next day)", "text": "add_time(\"10:10 PM\", \"3:30\") → \"1:40 AM (next day)\""}, {"t": "call", "fn": "add_time", "args": ["11:43 PM", "24:20", "Tuesday"], "expect": "12:03 AM Thursday (2 days later)", "text": "add_time(\"11:43 PM\", \"24:20\", \"Tuesday\") → \"12:03 AM Thursday (2 days later)\""}, {"t": "call", "fn": "add_time", "args": ["6:30 PM", "205:12"], "expect": "7:42 AM (9 days later)", "text": "add_time(\"6:30 PM\", \"205:12\") → \"7:42 AM (9 days later)\""}]}, {"id": "p3", "block": 8, "project": true, "title": "Проект: Приложение «Бюджет»", "desc": "\n<p>Реализуйте класс <code>Category<\/code> — категорию бюджета (еда, одежда, развлечения) с учётом приходов и расходов, и функцию <code>create_spend_chart(categories)<\/code>.<\/p>\n<h3>Класс Category<\/h3>\n<ul>\n<li><code>Category(\"еда\")<\/code> — конструктор с названием; хранит список операций <code>ledger<\/code> (словари <code>{\"amount\": ..., \"description\": ...}<\/code>).<\/li>\n<li><code>deposit(amount, description=\"\")<\/code> — приход (положительная сумма).<\/li>\n<li><code>withdraw(amount, description=\"\")<\/code> — расход; если средств не хватает, вернуть <code>False<\/code> и ничего не менять; иначе записать <code>-amount<\/code> и вернуть <code>True<\/code>.<\/li>\n<li><code>get_balance()<\/code> — баланс (сумма всех операций).<\/li>\n<li><code>transfer(amount, other_category)<\/code> — перевод: при нехватке средств <code>False<\/code>; иначе списать у себя с описанием <code>Transfer to {other.name}<\/code>, зачислить другой категории с описанием <code>Transfer from {self.name}<\/code>, вернуть <code>True<\/code>.<\/li>\n<li><code>check_funds(amount)<\/code> — <code>True<\/code>, если баланс не меньше amount.<\/li>\n<\/ul>\n<h3>__str__<\/h3>\n<p>Название по центру из 30 символов, заполненных <code>*<\/code>; далее операции: описание (обрезанное до 23 символов, выровнено влево, поле 23) и сумма (выровнена вправо, поле 7, два знака после запятой); в конце строка <code>Total: {баланс:.2f}<\/code>:<\/p>\n<pre><code>*************food*************\ninitial                1000.00\nrestaurant              -10.15\ngroceries               -15.89\nTotal: 973.96<\/code><\/pre>\n<h3>create_spend_chart(categories)<\/h3>\n<p>Функция возвращает строку: первая линия — <code>Расходы по категориям<\/code>, затем для каждой категории линия <code>{name}: {\"#\" * (pct // 10)} {pct}%<\/code>, где <code>pct<\/code> — доля расходов категории в общих расходах всех категорий, округлённая <b>вниз<\/b> до целого (<code>int()<\/code>). Учитываются только расходы (отрицательные операции).<\/p>\n<pre><code>Расходы по категориям\na: ##### 50%\nb: ## 25%\nc: ## 25%<\/code><\/pre>\n<div class=\"task\"><h4>🎯 Задание<\/h4><p>Реализуйте класс и функцию согласно спецификации и пройдите все тесты.<\/p><\/div>\n", "seed": "class Category:\n    def __init__(self, name):\n        # Ваш код здесь\n        pass\n\n\ndef create_spend_chart(categories):\n    # Ваш код здесь\n    pass\n", "hint": "<p>Для __str__: <code>self.name.center(30, \"*\")<\/code>, затем <code>item[\"description\"][:23].ljust(23) + f'{item[\"amount\"]:>7.2f}'<\/code>. Для графика: расходы = <code>abs(x)<\/code> по отрицательным операциям; <code>pct = int(spent / total * 100)<\/code>.<\/p>", "solution": "class Category:\n    def __init__(self, name):\n        self.name = name\n        self.ledger = []\n\n    def deposit(self, amount, description=\"\"):\n        self.ledger.append({\"amount\": amount, \"description\": description})\n\n    def check_funds(self, amount):\n        return self.get_balance() >= amount\n\n    def withdraw(self, amount, description=\"\"):\n        if not self.check_funds(amount):\n            return False\n        self.ledger.append({\"amount\": -amount, \"description\": description})\n        return True\n\n    def get_balance(self):\n        return sum(item[\"amount\"] for item in self.ledger)\n\n    def transfer(self, amount, other):\n        if not self.check_funds(amount):\n            return False\n        self.withdraw(amount, f\"Transfer to {other.name}\")\n        other.deposit(amount, f\"Transfer from {self.name}\")\n        return True\n\n    def __str__(self):\n        lines = [self.name.center(30, \"*\")]\n        for item in self.ledger:\n            lines.append(item[\"description\"][:23].ljust(23)\n                         + f'{item[\"amount\"]:>7.2f}')\n        lines.append(f\"Total: {self.get_balance():.2f}\")\n        return \"\\n\".join(lines)\n\n\ndef create_spend_chart(categories):\n    spent = [abs(sum(i[\"amount\"] for i in c.ledger if i[\"amount\"] < 0))\n             for c in categories]\n    total = sum(spent) or 1\n    lines = [\"Расходы по категориям\"]\n    for c, s in zip(categories, spent):\n        pct = int(s / total * 100)\n        lines.append(f'{c.name}: {\"#\" * (pct // 10)} {pct}%')\n    return \"\\n\".join(lines)", "tests": [{"t": "run", "code": "food = Category('food')\nfood.deposit(1000, 'initial')\nfood.withdraw(10.15, 'restaurant')\nfood.withdraw(15.89, 'groceries')\nprint(food.get_balance())", "expectLines": ["973.96"], "text": "deposit/withdraw/get_balance: баланс 973.96", "static": "def\\s+get_balance"}, {"t": "run", "code": "food2 = Category('food')\nfood2.deposit(100)\nprint(food2.withdraw(100.5))\nprint(food2.get_balance())\nprint(food2.check_funds(100))", "expectLines": ["False", "100", "True"], "text": "withdraw сверх баланса возвращает False и не меняет баланс"}, {"t": "run", "code": "a = Category('a'); b = Category('b')\na.deposit(900)\nprint(a.transfer(15.5, b))\nprint(b.get_balance())\nprint(a.get_balance())", "expectLines": ["True", "15.5", "884.5"], "text": "transfer переводит средства между категориями", "static": "def\\s+transfer"}, {"t": "run", "code": "food = Category('food')\nfood.deposit(1000, 'initial')\nfood.withdraw(10.15, 'restaurant')\nfood.withdraw(15.89, 'groceries')\nprint(food)", "expectLines": ["*************food*************", "initial                1000.00", "restaurant              -10.15", "groceries               -15.89", "Total: 973.96"], "text": "__str__ форматирует категорию по образцу", "static": "def\\s+__str__"}, {"t": "run", "code": "a = Category('a'); b = Category('b'); c = Category('c')\nfor cat in (a, b, c):\n    cat.deposit(100)\na.withdraw(50); b.withdraw(25); c.withdraw(25)\nprint(create_spend_chart([a, b, c]))", "expectLines": ["Расходы по категориям", "a: ##### 50%", "b: ## 25%", "c: ## 25%"], "text": "create_spend_chart строит диаграмму расходов", "static": "def\\s+create_spend_chart"}, {"t": "code", "v": "class\\s+Category", "text": "Класс Category определён", "flags": ""}]}, {"id": "p4", "block": 8, "project": true, "title": "Проект: Калькулятор площадей", "desc": "\n<p>Реализуйте классы <code>Rectangle<\/code> и <code>Square<\/code> (квадрат наследуется от прямоугольника).<\/p>\n<h3>Rectangle(width, height)<\/h3>\n<ul>\n<li><code>set_width(w)<\/code>, <code>set_height(h)<\/code> — изменить стороны;<\/li>\n<li><code>get_area()<\/code> → <code>width * height<\/code>;<\/li>\n<li><code>get_perimeter()<\/code> → <code>2*width + 2*height<\/code>;<\/li>\n<li><code>get_diagonal()<\/code> → <code>(width ** 2 + height ** 2) ** 0.5<\/code>;<\/li>\n<li><code>get_picture()<\/code> → строка-«рисунок» из <code>*<\/code>: каждая строка — <code>width<\/code> звёздочек, всего <code>height<\/code> строк через <code>\"\\n\"<\/code>. Если любая сторона больше 50 — вернуть <code>Слишком большая фигура для отображения.<\/code>;<\/li>\n<li><code>get_amount_inside(shape)<\/code> → сколько раз фигура <code>shape<\/code> «помещается» по площади: целочисленное деление площадей;<\/li>\n<li><code>__str__<\/code> → <code>Rectangle(width=5, height=10)<\/code>.<\/li>\n<\/ul>\n<h3>Square(side)<\/h3>\n<ul>\n<li>наследуется от <code>Rectangle<\/code>, конструктор принимает одну сторону;<\/li>\n<li><code>set_side(s)<\/code> меняет обе стороны; <code>set_width<\/code> и <code>set_height<\/code> тоже должны менять обе стороны;<\/li>\n<li><code>__str__<\/code> → <code>Square(side=9)<\/code>.<\/li>\n<\/ul>\n<h3>Пример<\/h3>\n<pre><code>rect = Rectangle(5, 10)\nrect.get_area()      # 50\nrect.get_picture()   # \"*****\\n*****\\n...\" (10 строк по 5 звёзд)\nsq = Square(9)\nrect.get_amount_inside(sq)   # 50 // 81 = 0<\/code><\/pre>\n<div class=\"task\"><h4>🎯 Задание<\/h4><p>Реализуйте оба класса и пройдите все тесты.<\/p><\/div>\n", "seed": "class Rectangle:\n    def __init__(self, width, height):\n        # Ваш код здесь\n        pass\n\n\nclass Square(Rectangle):\n    def __init__(self, side):\n        # Ваш код здесь\n        pass\n", "hint": "<p>get_picture: <code>\"\\n\".join(\"*\" * self.width for _ in range(self.height))<\/code>. В Square переопределите <code>set_width<\/code> и <code>set_height<\/code> так, чтобы они вызывали <code>set_side<\/code>. Конструктор Square: <code>super().__init__(side, side)<\/code>.<\/p>", "solution": "class Rectangle:\n    def __init__(self, width, height):\n        self.width = width\n        self.height = height\n\n    def set_width(self, width):\n        self.width = width\n\n    def set_height(self, height):\n        self.height = height\n\n    def get_area(self):\n        return self.width * self.height\n\n    def get_perimeter(self):\n        return 2 * self.width + 2 * self.height\n\n    def get_diagonal(self):\n        return (self.width ** 2 + self.height ** 2) ** 0.5\n\n    def get_picture(self):\n        if self.width > 50 or self.height > 50:\n            return \"Слишком большая фигура для отображения.\"\n        return \"\\n\".join(\"*\" * self.width for _ in range(self.height))\n\n    def get_amount_inside(self, shape):\n        return self.get_area() // shape.get_area()\n\n    def __str__(self):\n        return f\"Rectangle(width={self.width}, height={self.height})\"\n\n\nclass Square(Rectangle):\n    def __init__(self, side):\n        super().__init__(side, side)\n\n    def set_side(self, side):\n        self.width = side\n        self.height = side\n\n    def set_width(self, side):\n        self.set_side(side)\n\n    def set_height(self, side):\n        self.set_side(side)\n\n    def __str__(self):\n        return f\"Square(side={self.width})\"", "tests": [{"t": "run", "code": "rect = Rectangle(5, 10)\nprint(rect.get_area())\nprint(rect.get_perimeter())\nprint(rect.get_diagonal())", "expectLines": ["50", "30", "11.180339887498949"], "text": "Площадь, периметр и диагональ Rectangle(5, 10)", "static": "def\\s+get_area"}, {"t": "run", "code": "rect = Rectangle(5, 3)\nprint(rect.get_picture())", "expectLines": ["*****", "*****", "*****"], "text": "get_picture() рисует фигуру из звёздочек", "static": "def\\s+get_picture"}, {"t": "run", "code": "rect = Rectangle(51, 3)\nprint(rect.get_picture())", "expectLines": ["Слишком большая фигура для отображения."], "text": "Слишком большие фигуры не рисуются"}, {"t": "run", "code": "rect = Rectangle(5, 10)\nrect.set_width(3)\nprint(rect)\nprint(rect.get_area())", "expectLines": ["Rectangle(width=3, height=10)", "30"], "text": "set_width меняет ширину; __str__ корректен", "static": "def\\s+__str__"}, {"t": "run", "code": "sq = Square(9)\nprint(sq.get_area())\nprint(sq)\nsq.set_width(4)\nprint(sq)\nprint(sq.get_diagonal())", "expectLines": ["81", "Square(side=9)", "Square(side=4)", "5.656854249492381"], "text": "Square: set_width меняет обе стороны, __str__ = Square(side=4)", "static": "class\\s+Square"}, {"t": "run", "code": "rect = Rectangle(4, 8)\nsq = Square(2)\nprint(rect.get_amount_inside(sq))\nprint(Square(2).get_amount_inside(rect))", "expectLines": ["8", "0"], "text": "get_amount_inside считает по площадям", "static": "def\\s+get_amount_inside"}]}, {"id": "p5", "block": 8, "project": true, "title": "Проект: Калькулятор вероятностей", "desc": "\n<p>Классическая задача теории вероятностей: в шляпе лежат разноцветные шары; сколько вероятно вытащить нужный набор? Реализуйте класс <code>Hat<\/code> и функцию <code>prob_experiment<\/code> — методом Монте-Карло.<\/p>\n<h3>Класс Hat<\/h3>\n<ul>\n<li>Создаётся с именованными аргументами: <code>Hat(yellow=3, blue=1)<\/code> — 3 жёлтых шара, 1 синий.<\/li>\n<li>Атрибут <code>contents<\/code> — список строк-цветов: <code>[\"yellow\", \"yellow\", \"yellow\", \"blue\"]<\/code>.<\/li>\n<li>Метод <code>draw(n)<\/code> — вынуть <b>случайные<\/b> n шаров (используйте <code>random.sample<\/code>), удалить их из <code>contents<\/code> и вернуть списком. Если <code>n &gt;= len(contents)<\/code> — вернуть все шары и очистить шляпу.<\/li>\n<\/ul>\n<h3>prob_experiment(hat, expected_balls, num_experiments)<\/h3>\n<ul>\n<li>Проведите <code>num_experiments<\/code> экспериментов: в каждом — <b>копия<\/b> шляпы (<code>copy.deepcopy<\/code>), из неё достают <code>sum(expected_balls.values())<\/code> шаров.<\/li>\n<li>Эксперимент успешен, если для каждого цвета из <code>expected_balls<\/code> вынуто не меньше указанного количества.<\/li>\n<li>Верните вероятность: число успешных экспериментов / всего экспериментов.<\/li>\n<\/ul>\n<h3>Пример<\/h3>\n<pre><code>hat = Hat(black=6, red=4, green=3)\nprobability = prob_experiment(hat, {\"red\": 2, \"green\": 2}, 1000)\n# ≈ 0.027 — вероятность вытянуть 2 красных и 2 зелёных<\/code><\/pre>\n<div class=\"note\">💡 Так как результат случайный, тест проверяет, что вероятность попала в разумный диапазон, а не точное значение.<\/div>\n<div class=\"task\"><h4>🎯 Задание<\/h4><p>Реализуйте <code>Hat<\/code> и <code>prob_experiment<\/code> и пройдите все тесты. Не забудьте <code>import random<\/code> и <code>import copy<\/code>.<\/p><\/div>\n", "seed": "import random\nimport copy\n\n\nclass Hat:\n    def __init__(self, **kwargs):\n        # Ваш код здесь\n        pass\n\n    def draw(self, n):\n        # Ваш код здесь\n        pass\n\n\ndef prob_experiment(hat, expected_balls, num_experiments):\n    # Ваш код здесь\n    pass\n", "hint": "<p>В <code>__init__<\/code>: <code>for color, count in kwargs.items(): self.contents.extend([color] * count)<\/code>. В <code>draw<\/code>: <code>random.sample(self.contents, n)<\/code>, затем удалите каждый вынутый шар из <code>contents<\/code> через <code>remove<\/code>. В эксперименте: <code>hat_copy = copy.deepcopy(hat)<\/code>; успех — <code>all(drawn.count(c) &gt;= n for c, n in expected_balls.items())<\/code>.<\/p>", "solution": "import random\nimport copy\n\n\nclass Hat:\n    def __init__(self, **kwargs):\n        self.contents = []\n        for color, count in kwargs.items():\n            self.contents.extend([color] * count)\n\n    def draw(self, n):\n        if n >= len(self.contents):\n            drawn = self.contents[:]\n            self.contents = []\n            return drawn\n        drawn = random.sample(self.contents, n)\n        for ball in drawn:\n            self.contents.remove(ball)\n        return drawn\n\n\ndef prob_experiment(hat, expected_balls, num_experiments):\n    matches = 0\n    for _ in range(num_experiments):\n        hat_copy = copy.deepcopy(hat)\n        drawn = hat_copy.draw(sum(expected_balls.values()))\n        if all(drawn.count(color) >= need\n               for color, need in expected_balls.items()):\n            matches += 1\n    return matches / num_experiments", "tests": [{"t": "run", "code": "hat = Hat(yellow=5)\nprint(hat.draw(3))\nprint(hat.contents)", "expectLines": ["['yellow', 'yellow', 'yellow']", "['yellow', 'yellow']"], "text": "draw(n) вынимает n шаров и уменьшает contents", "static": "def\\s+draw"}, {"t": "run", "code": "hat = Hat(blue=3, red=2)\nprint(sorted(hat.contents))\ndrawn = hat.draw(10)\nprint(len(drawn), hat.contents)", "expectLines": ["['blue', 'blue', 'blue', 'red', 'red']", "5 []"], "text": "draw() при n ≥ количества шаров возвращает все и очищает шляпу", "static": "contents"}, {"t": "run", "code": "random.seed(95)\nhat = Hat(black=6, red=4, green=3)\np = prob_experiment(hat, {'red': 2, 'green': 2}, 1000)\nprint(0.012 <= p <= 0.045)", "expectLines": ["True"], "text": "prob_experiment возвращает вероятность ≈0.027 (в допустимом диапазоне)", "static": "def\\s+prob_experiment"}, {"t": "run", "code": "random.seed(7)\nhat = Hat(red=10)\np = prob_experiment(hat, {'red': 1}, 100)\nprint(p == 1.0)", "expectLines": ["True"], "text": "Вероятность достоверного события равна 1.0"}, {"t": "code", "v": "class\\s+Hat", "text": "Класс Hat определён", "flags": ""}, {"t": "code", "v": "deepcopy", "text": "Используется copy.deepcopy для независимых экспериментов", "flags": ""}]}]};

<script>
/* ================== freePyCamp application ================== */
(function () {
'use strict';

/* ---------- constants & state ---------- */
var LS_KEY = 'freepycamp_progress_v1';
var PYODIDE_VERSION = 'v0.26.4';
var PYODIDE_URL = 'https://cdn.jsdelivr.net/pyodide/' + PYODIDE_VERSION + '/full/';

var DATA = window.__COURSE_DATA__ || { blocks: [], lessons: [] };
var LESSONS = DATA.lessons || [];
var BLOCKS = DATA.blocks || [];
var lessonById = {};
LESSONS.forEach(function (l, i) { l._idx = i; lessonById[l.id] = l; });

var state = { done: {}, code: {}, cert: null, openBlocks: {} };
try {
  var saved = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
  if (saved && typeof saved === 'object') {
    state.done = saved.done || {};
    state.code = saved.code || {};
    state.cert = saved.cert || null;
    state.openBlocks = saved.openBlocks || {};
  }
} catch (e) { /* ignore */ }

function saveState() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
}

function doneCount() { return LESSONS.filter(function (l) { return state.done[l.id]; }).length; }
function firstIncomplete() {
  for (var i = 0; i < LESSONS.length; i++) if (!state.done[LESSONS[i].id]) return LESSONS[i];
  return null;
}

/* ---------- pyodide ---------- */
var pyodide = null, pyLoading = null, pyFailed = false;
var outSink = [], errSink = [];

function setStatus(cls, text) {
  var el = document.getElementById('py-status');
  if (!el) return;
  el.className = 'py-status ' + (cls || '');
  el.textContent = text;
}

function loadScriptOnce(src) {
  return new Promise(function (res, rej) {
    var s = document.createElement('script');
    s.src = src; s.onload = res;
    s.onerror = function () { rej(new Error('Не удалось загрузить ' + src)); };
    document.head.appendChild(s);
  });
}

function ensurePyodide() {
  if (pyodide) return Promise.resolve(pyodide);
  if (pyLoading) return pyLoading;
  pyLoading = (async function () {
    setStatus('loading', 'Python: загрузка…');
    await loadScriptOnce(PYODIDE_URL + 'pyodide.js');
    pyodide = await loadPyodide({ indexURL: PYODIDE_URL });
    pyodide.setStdout({ batched: function (s) { outSink.push(s); } });
    pyodide.setStderr({ batched: function (s) { errSink.push(s); } });
    setStatus('ready', 'Python: готов ✓');
    return pyodide;
  })().catch(function (e) {
    pyLoading = null; pyFailed = true;
    setStatus('offline', 'Python: офлайн-режим');
    console.warn('Pyodide load failed:', e);
    throw e;
  });
  return pyLoading;
}

function buildPreamble(stdinLines) {
  return 'import builtins as _bc, json as _json\n' +
    '_pycamp_stdin = ' + JSON.stringify((stdinLines || []).map(String)) + '\n' +
    'def _pycamp_input(prompt=""):\n' +
    '    if prompt:\n' +
    '        print(prompt, end="", flush=True)\n' +
    '    if _pycamp_stdin:\n' +
    '        return _pycamp_stdin.pop(0)\n' +
    '    raise EOFError("EOF when reading a line")\n' +
    '_bc.input = _pycamp_input\n' +
    'def _pycamp_dump(o):\n' +
    '    def _d(x):\n' +
    '        if isinstance(x, (set, frozenset)):\n' +
    '            return sorted(map(str, x))\n' +
    '        if isinstance(x, tuple):\n' +
    '            return list(x)\n' +
    '        return str(x)\n' +
    '    return _json.dumps(o, default=_d, ensure_ascii=False)\n';
}

function cleanTrace(e) {
  var m = (e && e.message) ? String(e.message) : String(e);
  var idx = m.indexOf('Traceback (most recent call last):');
  if (idx > -1) m = m.slice(idx);
  var lines = m.split('\n').filter(function (ln) { return !/^\s*at .*pyodide/.test(ln); });
  return lines.join('\n').trim();
}

async function execCode(code, stdinLines) {
  var g = pyodide.globals.get('dict')();
  outSink = []; errSink = [];
  var crashed = false, errText = '';
  try {
    await pyodide.runPythonAsync(buildPreamble(stdinLines) + '\n' + code, { globals: g });
  } catch (e) {
    crashed = true;
    errText = cleanTrace(e);
  }
  var userOut = outSink.join('\n');
  var userErr = errSink.join('\n');
  return { g: g, userOut: userOut, userErr: userErr, errText: errText, crashed: crashed };
}

/* ---------- test engine ---------- */
function deepEq(a, b) {
  if (a === b) return true;
  if (typeof a === 'number' && typeof b === 'number') return Math.abs(a - b) < 1e-9;
  if (!a || !b || typeof a !== 'object' || typeof b !== 'object') return false;
  if (Array.isArray(a) !== Array.isArray(b)) return false;
  var ka = Object.keys(a), kb = Object.keys(b);
  if (ka.length !== kb.length) return false;
  for (var i = 0; i < ka.length; i++) if (!deepEq(a[ka[i]], b[ka[i]])) return false;
  return true;
}

function trimLines(s) {
  return String(s == null ? '' : s).replace(/\r/g, '').split('\n')
    .map(function (x) { return x.trim(); })
    .filter(function (x) { return x !== ''; });
}

/* строгое построчное сравнение: сохраняем ведущие пробелы (важно для «столбика»),
   убираем только хвостовые пробелы и пустые строки в конце вывода */
function strictLines(s) {
  var arr = String(s == null ? '' : s).replace(/\r/g, '').split('\n')
    .map(function (x) { return x.replace(/\s+$/, ''); });
  while (arr.length && arr[arr.length - 1] === '') arr.pop();
  return arr;
}

async function evalTest(t, ctx) {
  var res = { text: t.text || t.t, pass: false, note: '', failMsg: '' };

  /* static code tests — always work */
  if (t.t === 'code' || t.t === 'codeNot') {
    try {
      var re = new RegExp(t.v, t.flags || '');
      var m = re.test(ctx.code);
      res.pass = (t.t === 'code') ? m : !m;
      if (!res.pass) res.failMsg = (t.t === 'code') ? 'В коде не найдено требуемое' : 'В коде найдено запрещённое';
    } catch (e) { res.failMsg = 'Ошибка проверки: ' + e.message; }
    return res;
  }

  /* offline fallback */
  if (!ctx.g) {
    if (t.static) {
      try {
        res.pass = new RegExp(t.static).test(ctx.code);
        res.note = 'проверено без запуска кода (офлайн)';
        if (!res.pass) res.failMsg = 'Статическая проверка не пройдена';
      } catch (e) { res.failMsg = e.message; }
    } else {
      res.pass = true;
      res.note = 'не проверено: интерпретатор Python не загружен (нужен интернет)';
      res.skipped = true;
    }
    return res;
  }

  var g = ctx.g;
  var runSnippet = async function (snippet) {
    outSink = [];
    await pyodide.runPythonAsync(snippet, { globals: g });
    return outSink.join('\n');
  };

  try {
    switch (t.t) {
      case 'out': {
        res.pass = String(ctx.userOut).indexOf(t.v) > -1;
        if (!res.pass) res.failMsg = 'Вывод программы не содержит: «' + t.v + '»';
        break;
      }
      case 'outExact': {
        res.pass = String(ctx.userOut).trim() === String(t.v).trim();
        if (!res.pass) res.failMsg = 'Ожидался вывод: «' + t.v + '», получено: «' + String(ctx.userOut).trim() + '»';
        break;
      }
      case 'outLines': {
        var got = strictLines(ctx.userOut);
        res.pass = got.length === t.v.length && t.v.every(function (ln, i) { return got[i] === String(ln); });
        if (!res.pass) res.failMsg = 'Ожидались строки: ' + JSON.stringify(t.v) + '; получено: ' + JSON.stringify(got);
        break;
      }
      case 'glob': {
        var dumped = await runSnippet('print(_pycamp_dump(' + t.name + '))');
        var val = JSON.parse(trimLines(dumped).pop() || 'null');
        res.pass = deepEq(val, t.v);
        if (!res.pass) res.failMsg = 'Переменная ' + t.name + ' = ' + JSON.stringify(val) + ', ожидалось ' + JSON.stringify(t.v);
        break;
      }
      case 'globType': {
        var tn = await runSnippet('print(type(' + t.name + ').__name__)');
        res.pass = trimLines(tn).pop() === t.v;
        if (!res.pass) res.failMsg = 'Тип переменной ' + t.name + ': ' + trimLines(tn)[0] + ', ожидалось ' + t.v;
        break;
      }
      case 'globContains': {
        var d2 = await runSnippet('print(_pycamp_dump(' + t.name + '))');
        var arr = JSON.parse(trimLines(d2).pop() || '[]');
        var arrStr = JSON.stringify(arr);
        res.pass = Array.isArray(arr) && t.v.every(function (item) {
          return arr.some(function (el) { return deepEq(el, item); });
        });
        if (!res.pass) res.failMsg = 'В ' + t.name + ' = ' + arrStr + ' не найдено: ' + JSON.stringify(t.v);
        break;
      }
      case 'run': {
        var o = await runSnippet(t.code);
        if (t.expectLines) {
          var gl = strictLines(o);
          res.pass = gl.length === t.expectLines.length && t.expectLines.every(function (ln, i) { return gl[i] === String(ln); });
          if (!res.pass) res.failMsg = 'Проверочный вывод: ' + JSON.stringify(gl) + ', ожидалось: ' + JSON.stringify(t.expectLines);
        } else {
          res.pass = String(o).indexOf(t.expect) > -1;
          if (!res.pass) res.failMsg = 'Проверочный вывод не содержит «' + t.expect + '». Получено: «' + String(o).trim().slice(0, 200) + '»';
        }
        break;
      }
      case 'call': {
        var argsJs = JSON.stringify(t.args || []);
        var snip = 'import json as _j2\n' +
          '_a = _j2.loads(' + JSON.stringify(argsJs) + ')\n' +
          'print(_pycamp_dump(' + t.fn + '(*_a)))';
        var o2 = await runSnippet(snip);
        var rv = JSON.parse(trimLines(o2).pop() || 'null');
        res.pass = deepEq(rv, t.expect);
        if (!res.pass) res.failMsg = t.fn + '(' + argsJs.slice(1, -1) + ') вернула ' + JSON.stringify(rv) + ', ожидалось ' + JSON.stringify(t.expect);
        break;
      }
      default:
        res.failMsg = 'Неизвестный тип теста: ' + t.t;
    }
  } catch (e) {
    res.pass = false;
    var msg = cleanTrace(e);
    res.failMsg = 'Ошибка при проверке: ' + (msg.split('\n').slice(-2).join(' ') || msg).slice(0, 300);
    if (/NameError/.test(msg) && t.name) res.failMsg = 'Переменная «' + t.name + '» не определена в вашем коде';
    if (/NameError/.test(msg) && t.fn) res.failMsg = 'Функция «' + t.fn + '» не определена в вашем коде';
  }
  return res;
}

/* ---------- syntax highlighting ---------- */
var PY_KEYWORDS = 'def class return if elif else for while in not and or is import from as with try except finally raise lambda yield global nonlocal pass break continue True False None match case del assert async await'.split(' ');
var PY_BUILTINS = 'print len range int str float bool list dict set tuple input type sum min max abs round sorted enumerate zip map filter open isinstance repr format any all super property staticmethod classmethod id hash reversed Exception ValueError TypeError KeyError IndexError ZeroDivisionError FileNotFoundError NameError AttributeError StopIteration EOFError NotImplementedError'.split(' ');
var KW_SET = {}, BI_SET = {};
PY_KEYWORDS.forEach(function (k) { KW_SET[k] = 1; });
PY_BUILTINS.forEach(function (k) { BI_SET[k] = 1; });

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

var HL_RE = new RegExp(
  '(#[^\\n]*)' +                                        /* 1 comment   */
  '|("""[\\s\\S]*?"""|\'\'\'[\\s\\S]*?\'\'\')' +        /* 2 docstring */
  '|([rbfuRBFU]{0,2}"(?:[^"\\\\\\n]|\\\\.)*")' +        /* 3 dq string */
  "|([rbfuRBFU]{0,2}'(?:[^'\\\\\\n]|\\\\.)*')" +        /* 4 sq string */
  '|\\b(\\d+\\.?\\d*(?:[eE][+-]?\\d+)?)\\b' +            /* 5 number    */
  '|\\b([A-Za-z_][A-Za-z_0-9]*)\\b(\\s*)(\\()?',         /* 6 id 7 sp 8 paren */
  'g'
);

function highlightPy(src) {
  var out = [], last = 0, m;
  HL_RE.lastIndex = 0;
  while ((m = HL_RE.exec(src)) !== null) {
    if (m.index > last) out.push(esc(src.slice(last, m.index)));
    if (m[1] != null) out.push('<span class="tok-com">' + esc(m[1]) + '</span>');
    else if (m[2] != null) out.push('<span class="tok-str">' + esc(m[2]) + '</span>');
    else if (m[3] != null) out.push('<span class="tok-str">' + esc(m[3]) + '</span>');
    else if (m[4] != null) out.push('<span class="tok-str">' + esc(m[4]) + '</span>');
    else if (m[5] != null) out.push('<span class="tok-num">' + esc(m[5]) + '</span>');
    else if (m[6] != null) {
      var id = m[6], html = '';
      if (KW_SET[id]) html = '<span class="tok-kw">' + id + '</span>';
      else if (m[8]) html = '<span class="tok-fn">' + id + '</span>';
      else if (BI_SET[id]) html = '<span class="tok-bi">' + id + '</span>';
      else html = esc(id);
      out.push(html);
      if (m[7]) out.push(m[7]);
      if (m[8]) out.push(m[8]);
    }
    last = HL_RE.lastIndex;
  }
  if (last < src.length) out.push(esc(src.slice(last)));
  return out.join('');
}

/* ---------- ui helpers ---------- */
function h(tag, attrs, children) {
  var el = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function (k) {
    if (k === 'class') el.className = attrs[k];
    else if (k === 'html') el.innerHTML = attrs[k];
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    else if (attrs[k] != null) el.setAttribute(k, attrs[k]);
  });
  (children || []).forEach(function (c) {
    if (c == null) return;
    el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return el;
}

function toast(msg, cls) {
  var host = document.getElementById('toast-host');
  if (!host) { host = h('div', { id: 'toast-host' }); document.body.appendChild(host); }
  var t = h('div', { class: 'toast ' + (cls || '') }, [msg]);
  host.appendChild(t);
  setTimeout(function () { t.style.opacity = '0'; t.style.transition = 'opacity .4s'; }, 2200);
  setTimeout(function () { t.remove(); }, 2700);
}

function confetti() {
  var colors = ['#f1be32', '#28a745', '#4b8bbe', '#e05252', '#bb9af7', '#7dcfff'];
  for (var i = 0; i < 90; i++) {
    var p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.width = (5 + Math.random() * 7) + 'px';
    p.style.height = (8 + Math.random() * 8) + 'px';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDuration = (2.2 + Math.random() * 2) + 's';
    p.style.animationDelay = (Math.random() * 0.7) + 's';
    p.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    document.body.appendChild(p);
    setTimeout(function (el) { return function () { el.remove(); }; }(p), 5200);
  }
}

function updateNavProgress() {
  var el = document.getElementById('nav-progress');
  if (el) el.textContent = '✔ ' + doneCount() + ' / ' + LESSONS.length;
  document.querySelectorAll('.nav-links a').forEach(function (a) {
    a.classList.remove('active');
    var hash = location.hash || '#/';
    if (a.getAttribute('href') === hash || (a.getAttribute('href') === '#/' && (hash === '' || hash === '#' || hash === '#/'))) {
      if (hash.indexOf('#/lesson') !== 0 || a.dataset.nav !== 'home') a.classList.add('active');
    }
  });
}

    var nameInput = h('input', { type: 'text', placeholder: 'Ваше имя и фамилия (на русском или английском)', maxlength: '60' });
    var form = h('div', { class: 'panel cert-form', style: 'padding:34px' }, [
      h('h2', { style: 'margin-bottom:8px' }, ['🎉 Поздравляем!']),
      h('p', { style: 'color:var(--text-dim);margin-bottom:20px' }, ['Вы прошли все ' + total + ' уроков курса «Python-разработчик». Введите имя, чтобы получить сертификат.']),
      nameInput,
      h('br'),
      h('button', {
        class: 'btn green', onclick: function () {
          var nm = nameInput.value.trim();
          if (nm.length < 2) { toast('Введите имя (минимум 2 символа)', 'bad'); return; }
          state.cert = { name: nm, date: new Date().toISOString().slice(0, 10) };
          saveState(); renderCert(); confetti();
        }
      }, ['Получить сертификат'])
    ]);
    wrap.appendChild(form);
    app.appendChild(wrap);
    return;
  }

  var cert = state.cert;
  var projects = LESSONS.filter(function (l) { return l.project; });
  var dateStr = new Date(cert.date + 'T12:00:00').toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
  var certEl = h('div', { class: 'certificate', id: 'the-certificate' }, [
    h('div', { class: 'cert-logo' }, ['🐍']),
    h('h1', {}, ['freePyCamp']),
    h('div', { class: 'cert-sub' }, ['СЕРТИФИКАТ ОБ УСПЕШНОМ ОКОНЧАНИИ КУРСА']),
    h('div', { class: 'cert-line' }, ['Настоящим подтверждается, что']),
    h('div', { class: 'cert-name' }, [cert.name]),
    h('div', { class: 'cert-line' }, ['успешно закончил(а) полный курс']),
    h('div', { class: 'cert-prog' }, ['«Python-разработчик» (~70 академических часов)']),
    h('div', { class: 'cert-projects' }, [
      h('p', { style: 'margin-bottom:6px;font-weight:700' }, ['включая 5 сертификационных проектов:']),
      h('ul', { style: 'margin-left:20px' }, projects.map(function (p) { return h('li', {}, ['✔ ' + p.title]); }))
    ]),
    h('div', { class: 'cert-footer' }, [
      h('div', {}, ['Дата выдачи: ' + dateStr]),
      h('div', { class: 'cert-sign' }, ['freePyCamp — команда курса'])
    ])
  ]);
  wrap.appendChild(certEl);
  wrap.appendChild(h('div', { class: 'cert-actions' }, [
    h('button', { class: 'btn', onclick: function () { window.print(); } }, ['🖨 Распечатать / PDF']),
    h('button', {
      class: 'btn secondary', onclick: function () {
        state.cert = null; saveState(); renderCert();
      }
    }, ['Изменить имя']),
    h('a', { class: 'btn secondary', href: '#/' }, ['← К курсу'])
  ]));
  app.appendChild(wrap);
}

/* ---------- lesson view ---------- */
var editorEls = {};

function renderLesson(id) {
  var lesson = lessonById[id];
  if (!lesson) { location.hash = '#/'; return; }
  app.innerHTML = '';
  var idx = lesson._idx, total = LESSONS.length;
  var prev = idx > 0 ? LESSONS[idx - 1] : null;
  var next = idx < total - 1 ? LESSONS[idx + 1] : null;

  /* top bar */
  var topbar = h('div', { class: 'lesson-topbar' }, [
    h('a', { class: 'icon-btn', href: '#/', style: 'text-decoration:none' }, ['← Курс']),
    h('span', { class: 'crumb', html: '<b>' + esc(BLOCKS[lesson.block].title) + '</b> · Урок ' + (idx + 1) + ' из ' + total + (state.done[lesson.id] ? ' · <span style="color:#7ee787">✓ пройден</span>' : '') }),
    h('span', { class: 'spacer' }),
    h('button', { class: 'icon-btn', disabled: prev ? null : 'disabled', onclick: function () { if (prev) location.hash = '#/lesson/' + prev.id; } }, ['← Пред.']),
    h('button', { class: 'icon-btn', disabled: next ? null : 'disabled', onclick: function () { if (next) location.hash = '#/lesson/' + next.id; } }, ['След. →'])
  ]);
  app.appendChild(topbar);

  /* mobile tabs */
  var tabs = h('div', { class: 'mobile-tabs' }, [
    h('button', { class: 'active', onclick: function (e) { setTab('instr', e.target); } }, ['📖 Задание']),
    h('button', { onclick: function (e) { setTab('code', e.target); } }, ['💻 Код'])
  ]);
  app.appendChild(tabs);

  var layout = h('div', { class: 'lesson-layout tab-instr' });
  app.appendChild(layout);

  /* left: instructions + tests */
  var left = h('div', { class: 'left-col' });
  var instrPanel = h('div', { class: 'panel' });
  instrPanel.appendChild(h('div', { class: 'panel-title' }, ['📖 Задание']));
  var instrBody = h('div', { class: 'instructions', html: '<h1>' + esc(lesson.title) + '</h1>' + lesson.desc });

  var hintBox = null, solBox = null;
  var buttonsRow = h('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;margin-top:16px' }, [
    lesson.hint ? h('button', {
      class: 'btn secondary small', onclick: function () {
        if (!hintBox) {
          hintBox = h('div', { class: 'reveal-box' }, [h('h4', {}, ['💡 Подсказка']), h('div', { html: lesson.hint })]);
          instrBody.appendChild(hintBox);
        } else { hintBox.remove(); hintBox = null; }
      }
    }, ['💡 Подсказка']) : null,
    h('button', {
      class: 'btn secondary small', onclick: function () {
        if (!solBox) {
          solBox = h('div', { class: 'reveal-box' }, [
            h('h4', {}, ['👁 Решение']),
            h('pre', { style: 'background:#0d0d26;border:1px solid var(--navy-600);border-radius:6px;padding:12px;overflow-x:auto' }, [
              h('code', { html: highlightPy(lesson.solution), style: 'font-family:var(--mono);font-size:.83rem;color:#e6e6f0;white-space:pre' })
            ]),
            h('button', {
              class: 'btn small', style: 'margin-top:8px', onclick: function () {
                setEditorCode(lesson.solution);
                solBox.remove(); solBox = null;
                toast('Решение вставлено в редактор — но попробуйте сначала сами! 😉');
              }
            }, ['Вставить в редактор'])
          ]);
          instrBody.appendChild(solBox);
          solBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } else { solBox.remove(); solBox = null; }
      }
    }, ['👁 Решение']),
    h('button', {
      class: 'btn danger small', onclick: function () {
        if (confirm('Вернуть исходный код заготовки?')) setEditorCode(lesson.seed || '');
      }
    }, ['↺ Сбросить код'])
  ]);
  instrBody.appendChild(buttonsRow);
  instrPanel.appendChild(instrBody);
  left.appendChild(instrPanel);

  var testsPanel = h('div', { class: 'panel tests-panel', style: 'margin-top:14px;display:none' });
  testsPanel.appendChild(h('div', { class: 'panel-title' }, ['🧪 Тесты']));
  var testsBody = h('div', { class: 'tests-body' });
  testsPanel.appendChild(testsBody);
  left.appendChild(testsPanel);
  layout.appendChild(left);

  /* right: editor + console */
  var right = h('div', { class: 'editor-col' });
  var edPanel = h('div', { class: 'panel editor-panel' });
  var edTitle = h('div', { class: 'panel-title' }, [
    h('span', {}, ['💻 editor.py']),
    h('span', { class: 'spacer' }),
    h('span', { style: 'font-weight:400;font-size:.75rem;color:var(--text-dim)' }, ['Ctrl+Enter — запуск'])
  ]);
  edPanel.appendChild(edTitle);

  var gutter = h('div', { class: 'gutter' });
  var hl = h('pre', { id: 'hl' });
  var ta = h('textarea', { id: 'code', spellcheck: 'false', autocapitalize: 'off', autocorrect: 'off', wrap: 'off' });
  var codeArea = h('div', { class: 'code-area' }, [hl, ta]);
  edPanel.appendChild(h('div', { class: 'editor-wrap' }, [gutter, codeArea]));

  var runBtn = h('button', { class: 'btn-run' }, ['▶ Запустить']);
  var checkBtn = h('button', { class: 'btn-check' }, ['✔ Проверить и отправить']);
  edPanel.appendChild(h('div', { class: 'controls' }, [
    runBtn, checkBtn,
    h('span', { class: 'spacer' }),
    h('button', {
      class: 'icon-btn', title: 'Отформатировать отступы', onclick: function () {
        setEditorCode(ta.value.replace(/\t/g, '    '));
      }
    }, ['␣ Табы→пробелы'])
  ]));
  right.appendChild(edPanel);

  var conPanel = h('div', { class: 'panel console-panel' });
  conPanel.appendChild(h('div', { class: 'panel-title' }, [
    h('span', {}, ['🖥 Консоль']),
    h('span', { class: 'spacer' }),
    h('button', { class: 'icon-btn', style: 'padding:2px 10px;font-size:.78rem', onclick: function () { conBody.innerHTML = ''; } }, ['очистить'])
  ]));
  var conBody = h('div', { class: 'console' });
  conPanel.appendChild(conBody);
  right.appendChild(conPanel);
  layout.appendChild(right);

  editorEls = { ta: ta, hl: hl, gutter: gutter, conBody: conBody, testsPanel: testsPanel, testsBody: testsBody, runBtn: runBtn, checkBtn: checkBtn, layout: layout, lesson: lesson };

  /* editor init */
  var initialCode = (state.code[lesson.id] != null) ? state.code[lesson.id] : (lesson.seed || '');
  setEditorCode(initialCode);

  var saveTimer = null;
  ta.addEventListener('input', function () {
    syncEditor();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () { state.code[lesson.id] = ta.value; saveState(); }, 400);
  });
  ta.addEventListener('scroll', function () {
    hl.scrollTop = ta.scrollTop; hl.scrollLeft = ta.scrollLeft;
    gutter.scrollTop = ta.scrollTop;
  });
  ta.addEventListener('keydown', function (e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      var s = ta.selectionStart, en = ta.selectionEnd;
      ta.value = ta.value.slice(0, s) + '    ' + ta.value.slice(en);
      ta.selectionStart = ta.selectionEnd = s + 4;
      syncEditor();
    } else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      if (e.shiftKey) doCheck(); else doRun();
    } else if (e.key === 'Enter') {
      /* simple auto-indent */
      var pos = ta.selectionStart;
      var before = ta.value.slice(0, pos);
      var line = before.split('\n').pop();
      var indent = (line.match(/^[ \t]*/) || [''])[0];
      if (/:\s*$/.test(line)) indent += '    ';
      if (indent) {
        e.preventDefault();
        ta.value = before + '\n' + indent + ta.value.slice(ta.selectionEnd);
        ta.selectionStart = ta.selectionEnd = pos + 1 + indent.length;
        syncEditor();
      }
    }
  });

  function setTab(which, btn) {
    layout.className = 'lesson-layout tab-' + which;
    tabs.querySelectorAll('button').forEach(function (b) { b.classList.remove('active'); });
    if (btn) btn.classList.add('active');
  }

  function consoleClear() { conBody.innerHTML = ''; }
  function consoleLine(text, cls) {
    String(text).split('\n').forEach(function (ln) {
      conBody.appendChild(h('div', { class: cls || 'out-line' }, [ln === '' ? ' ' : ln]));
    });
    conBody.scrollTop = conBody.scrollHeight;
  }

  function showUserOutput(out, err, crashed, errText) {
    if (out) consoleLine(out, 'out-line');
    if (err) consoleLine(err, 'err-line');
    if (crashed) consoleLine(errText || 'Программа завершилась с ошибкой', 'err-line');
    if (!out && !err && !crashed) consoleLine('(программа ничего не вывела)', 'sys-line');
  }

  async function doRun() {
    var code = ta.value;
    state.code[lesson.id] = code; saveState();
    runBtn.disabled = true;
    consoleClear();
    consoleLine('Запуск кода…', 'sys-line');
    try {
      await ensurePyodide();
      consoleClear();
      var r = await execCode(code, lesson.stdin);
      showUserOutput(r.userOut, r.userErr, r.crashed, r.errText);
      r.g.destroy();
      if (!r.crashed) consoleLine('✔ Выполнено без ошибок', 'ok-line');
    } catch (e) {
      consoleClear();
      consoleLine('Не удалось запустить интерпретатор Python (нужен интернет для первой загрузки Pyodide).', 'err-line');
      consoleLine(String(e.message || e), 'sys-line');
    }
    runBtn.disabled = false;
  }

  async function doCheck() {
    var code = ta.value;
    state.code[lesson.id] = code; saveState();
    checkBtn.disabled = true; runBtn.disabled = true;
    consoleClear();
    consoleLine('Проверяем решение…', 'sys-line');
    var exec = null;
    var runtimeNeeded = lesson.tests.some(function (t) { return t.t !== 'code' && t.t !== 'codeNot'; });
    try {
      if (runtimeNeeded) await ensurePyodide();
      if (pyodide) {
        exec = await execCode(code, lesson.stdin);
        showUserOutput(exec.userOut, exec.userErr, exec.crashed, exec.errText);
      } else {
        consoleLine('Интерпретатор недоступен — выполняется офлайн-проверка кода.', 'sys-line');
      }
      var ctx = { code: code, g: exec ? exec.g : null, userOut: exec ? exec.userOut : '', crashed: exec ? exec.crashed : false };
      var results = [];
      for (var i = 0; i < lesson.tests.length; i++) {
        results.push(await evalTest(lesson.tests[i], ctx));
      }
      if (exec) exec.g.destroy();
      renderTestResults(results);
    } catch (e) {
      consoleClear();
      consoleLine('Ошибка проверки: ' + String(e.message || e), 'err-line');
      consoleLine('Проверьте подключение к интернету — для запуска тестов нужен интерпретатор Python (Pyodide).', 'sys-line');
    }
    checkBtn.disabled = false; runBtn.disabled = false;
  }

  function renderTestResults(results) {
    testsPanel.style.display = 'block';
    testsBody.innerHTML = '';
    var allPass = results.every(function (r) { return r.pass; });

    if (allPass) {
      var wasDone = state.done[lesson.id];
      state.done[lesson.id] = true; saveState(); updateNavProgress();
      var nx = next;
      var allDone = doneCount() === LESSONS.length;
      var congrats = h('div', { class: 'congrats' }, [
        h('h3', {}, ['🎉 ' + (wasDone ? 'Тесты пройдены (повторно)!' : 'Поздравляем! Урок пройден!')]),
        h('p', {}, [allDone
          ? 'Вы завершили ВЕСЬ курс! Получите свой сертификат.'
          : 'Все тесты зелёные. Так держать!']),
        allDone
          ? h('a', { class: 'btn green small', href: '#/cert' }, ['🏆 Получить сертификат'])
          : (nx ? h('a', { class: 'btn green small', href: '#/lesson/' + nx.id }, ['Следующий урок: ' + esc(nx.title) + ' →']) : null)
      ]);
      testsBody.appendChild(congrats);
      if (!wasDone) {
        confetti();
        toast('Урок «' + lesson.title + '» пройден! +' + 1, 'ok');
      }
    } else {
      var failed = results.filter(function (r) { return !r.pass; }).length;
      testsBody.appendChild(h('div', { style: 'color:var(--red);font-weight:700;margin-bottom:8px' }, ['✗ Не пройдено тестов: ' + failed + ' из ' + results.length]));
    }

    results.forEach(function (r) {
      testsBody.appendChild(h('div', { class: 'test-item ' + (r.skipped ? 'skip' : (r.pass ? 'pass' : 'fail')) }, [
        h('span', { class: 'test-ico' }, [r.pass ? '✓' : '✗']),
        h('div', {}, [
          h('span', {}, [r.text]),
          r.note ? h('span', { class: 't-note' }, ['⚠ ' + r.note]) : null,
          !r.pass && r.failMsg ? h('span', { class: 't-note', style: 'color:#ff9d9d' }, [r.failMsg]) : null
        ])
      ]));
    });
    testsPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  runBtn.addEventListener('click', doRun);
  checkBtn.addEventListener('click', doCheck);

  /* preload pyodide in background once user lands on a lesson */
  if (!pyodide && !pyLoading && !pyFailed) {
    ensurePyodide().catch(function () { });
  }
}

/* ---------- editor sync ---------- */
function setEditorCode(code) {
  if (!editorEls.ta) return;
  editorEls.ta.value = code;
  syncEditor();
}

function syncEditor() {
  var ta = editorEls.ta, hl = editorEls.hl, gutter = editorEls.gutter;
  if (!ta) return;
  hl.innerHTML = highlightPy(ta.value) + '\n';
  hl.scrollTop = ta.scrollTop; hl.scrollLeft = ta.scrollLeft;
  var n = ta.value.split('\n').length;
  var nums = '';
  for (var i = 1; i <= n; i++) nums += i + '\n';
  gutter.textContent = nums;
  gutter.scrollTop = ta.scrollTop;
}

/* ---------- router ---------- */
function route() {
  var hash = location.hash || '#/';
  window.scrollTo(0, 0);
  if (hash.indexOf('#/lesson/') === 0) {
    renderLesson(hash.slice('#/lesson/'.length));
  } else if (hash === '#/about') {
    renderAbout();
  } else if (hash === '#/cert') {
    renderCert();
  } else {
    renderHome();
  }
  updateNavProgress();
}

/* ---------- boot ---------- */
function boot() {
  app = document.getElementById('app');
  window.addEventListener('hashchange', route);
  route();
  setStatus('', 'Python: не загружен');
}

window.App = { boot: boot };
})();

</script>
<script>
if (window.App && window.App.boot) window.App.boot();
</script>
</body>
</html>
