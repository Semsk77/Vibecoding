<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyCamp: Курс Python</title>
    <style>
        :root {
            --primary-color: #0066cc;
            --sidebar-bg: #f4f4f4;
            --text-color: #333;
            --code-bg: #f5f5f5;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; color: var(--text-color); }
        
        /* Layout */
        .layout { display: flex; min-height: 100vh; flex-direction: column; }
        header { background: var(--primary-color); color: white; padding: 1rem 2rem; position: sticky; top: 0; z-index: 100; }
        header h1 { font-size: 1.5rem; }
        .main-content { display: flex; flex: 1; overflow: hidden; }
        
        /* Sidebar */
        nav#sidebar { width: 280px; background: var(--sidebar-bg); border-right: 1px solid #ddd; overflow-y: auto; padding: 1rem; display: none; flex-direction: column; }
        nav#sidebar.active { display: flex; }
        nav#sidebar h3 { margin-bottom: 1rem; font-size: 1.1rem; color: #222; }
        nav#sidebar ul { list-style: none; }
        nav#sidebar li { margin-bottom: 0.5rem; }
        nav#sidebar a { text-decoration: none; color: #0066cc; display: block; padding: 0.5rem; border-radius: 4px; }
        nav#sidebar a:hover, nav#sidebar a.active { background: #e0e0e0; }

        /* Main */
        main { flex: 1; overflow-y: auto; padding: 2rem; }
        .lesson-content h2 { margin-bottom: 1rem; }
        .lesson-content p { margin-bottom: 1rem; }
        .code-container { display: flex; flex-direction: column; gap: 1rem; margin-top: 2rem; border: 1px solid #ccc; border-radius: 8px; overflow: hidden; background: white; }
        .code-editor { width: 100%; height: 200px; font-family: "Fira Code", "Courier New", monospace; font-size: 14px; padding: 1rem; border: none; resize: vertical; background: var(--code-bg); border-radius: 0 0 0 8px; }
        .console-output { width: 100%; height: 150px; font-family: "Courier New", monospace; font-size: 13px; padding: 1rem; background: #1e1e1e; color: #00ff00; overflow-y: auto; border-radius: 0 0 8px 0; }
        .controls { display: flex; gap: 1rem; align-items: center; }
        button { background: var(--primary-color); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; cursor: pointer; font-size: 1rem; }
        button:hover { background: #0055a3; }
        button:disabled { background: #99c2ff; cursor: not-allowed; }
        
        /* Mobile */
        .mobile-nav-toggle { display: none; background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }
        
        @media (max-width: 768px) {
            .main-content { flex-direction: column; }
            nav#sidebar { position: fixed; height: 100%; left: -300px; transition: left 0.3s ease; z-index: 200; }
            nav#sidebar.active { left: 0; }
            .mobile-nav-toggle { display: block; }
            main { padding: 1rem; }
        }

        .hidden { display: none; }
    </style>
</head>
<body>
<div class="layout">
    <header>
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>PyCamp</h1>
            <button class="mobile-nav-toggle" aria-label="Открыть меню">☰</button>
        </div>
    </header>
    
    <div class="main-content">
        <nav id="sidebar">
            <h3>Содержание курса</h3>
            <ul id="lesson-list">
                <!-- Уроки генерируются скриптом -->
            </ul>
        </nav>

        <main id="lesson-container">
            <!-- Контент уроков генерируется скриптом -->
        </main>
    </div>
</div>

<!-- Pyodide (Python в браузере) -->
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>

<script>
// --- ДАННЫЕ КУРСА ---
const lessons = [
    {
        id: 1, title: "Вывод текста (print)", content: `
<h2>Урок 1: Вывод текста</h2>
<p>Самая первая программа на любом языке — «Hello, World!». В Python для вывода данных в консоль используется функция <code>print()</code>.</p>
<p><strong>Задание:</strong> Измените код так, чтобы программа выводила ваше имя.</p>
`,
        code: `print("Hello, World!")`
    },
    {
        id: 2, title: "Переменные и типы данных", content: `
<h2>Урок 2: Переменные</h2>
<p>Переменные — это именованные ячейки памяти. В Python не нужно явно указывать тип данных.</p>
<p><strong>Задание:</strong> Создайте переменную <code>age</code> и выведите её значение.</p>
`,
        code: `name = "Alex"
print("Имя:", name)`
    },
    {
        id: 3, title: "Арифметические операции", content: `
<h2>Урок 3: Математика</h2>
<p>Python отлично подходит для вычислений. Основные операторы: <code>+</code>, <code>-</code>, <code>*</code>, <code>/</code> (деление), <code>//</code> (целочисленное деление), <code>%</code> (остаток), <code>**</code> (степень).</p>
<p><strong>Задание:</strong> Посчитайте площадь прямоугольника со сторонами 5 и 10.</p>
`,
        code: `a = 5
b = 10
area = a * b
print("Площадь:", area)`
    },
    {
        id: 4, title: "Условные операторы (if/else)", content: `
<h2>Урок 4: Условия</h2>
<p>С помощью <code>if</code> программа может принимать решения.</p>
<p><strong>Задание:</strong> Проверьте, является ли число 15 четным.</p>
`,
        code: `number = 10
if number % 2 == 0:
    print("Четное")
else:
    print("Нечетное")`
    },
    {
        id: 5, title: "Цикл for", content: `
<h2>Урок 5: Цикл for</h2>
<p>Цикл <code>for</code> используется для перебора элементов (например, в списке) или для выполнения кода определенное количество раз.</p>
<p><strong>Задание:</strong> Выведите числа от 1 до 5.</p>
`,
        code: `for i in range(3):
    print("Итерация", i + 1)`
    },
    {
        id: 6, title: "Цикл while", content: `
<h2>Урок 6: Цикл while</h2>
<p>Цикл <code>while</code> выполняется до тех пор, пока условие истинно. Будьте осторожны: если условие никогда не станет ложным, программа зависнет.</p>
<p><strong>Задание:</strong> Выведите числа от 5 до 1.</p>
`,
        code: `counter = 3
while counter > 0:
    print("Осталось", counter)
    counter -= 1`
    },
    {
        id: 7, title: "Списки (Lists)", content: `
<h2>Урок 7: Списки</h2>
<p>Список — это упорядоченная изменяемая коллекция элементов.</p>
<p><strong>Задание:</strong> Добавьте в список <code>fruits</code> элемент "Виноград".</p>
`,
        code: `fruits = ["Яблоко", "Банан", "Груша"]
print(fruits)
fruits.append("Апельсин")
print("После добавления:", fruits)`
    },
    {
        id: 8, title: "Функции (def)", content: `
<h2>Урок 8: Функции</h2>
<p>Функции позволяют упаковать код в переиспользуемые блоки. Создаются с помощью ключевого слова <code>def</code>.</p>
<p><strong>Задание:</strong> Создайте функцию <code>greet</code>, которая принимает имя и выводит приветствие.</p>
`,
        code: `def add(x, y):
    return x + y

result = add(10, 20)
print("Результат:", result)`
    },
    {
        id: 9, title: "Словари (Dictionaries)", content: `
<h2>Урок 9: Словари</h2>
<p>Словарь — это неупорядоченная коллекция пар «ключ: значение».</p>
<p><strong>Задание:</strong> Выведите возраст пользователя из словаря.</p>
`,
        code: `user = {"name": "Иван", "age": 30, "city": "Москва"}
print(user["name"])`
    },
    {
        id: 10, title: "ООП: Классы", content: `
<h2>Урок 10: Классы и объекты</h2>
<p>Объектно-ориентированное программирование (ООП) — парадигма, где всё является объектом. Класс — это чертеж объекта.</p>
<p><strong>Задание:</strong> Создайте экземпляр класса <code>Dog</code> и заставьте его лаять.</p>
`,
        code: `class Dog:
    def __init__(self, name):
        self.name = name
    
    def bark(self):
        print(self.name + " говорит: Гав!")

my_dog = Dog("Бобик")
my_dog.bark()`
    }
];

// --- ЛОГИКА ПРИЛОЖЕНИЯ ---
let pyodide = null;
let currentLessonId = 1;

// Загрузка Pyodide
async function loadPyodide() {
    const loadingEl = document.getElementById('loading-indicator');
    if (loadingEl) loadingEl.style.display = 'block';
    pyodide = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.1/full/" });
    await pyodide.loadPackage("micropip");
    if (loadingEl) loadingEl.style.display = 'none';
}

// Рендеринг уроков
function renderLesson(id) {
    const lesson = lessons.find(l => l.id === id);
    if (!lesson) return;

    document.getElementById('lesson-container').innerHTML = `
        ${lesson.content}
        <div class="code-container">
            <textarea class="code-editor" id="code-editor">${lesson.code}</textarea>
            <div class="controls">
                <button id="run-btn">▶️ Выполнить код</button>
                <span id="loading-indicator" class="hidden">Выполняется...</span>
            </div>
            <pre class="console-output" id="console-output"></pre>
        </div>
    `;

    // Обновление навигации
    document.querySelectorAll('#lesson-list a').forEach(a => a.classList.remove('active'));
    document.querySelector(`#lesson-list a[data-id="${id}"]`).classList.add('active');

    // Восстановление кода из памяти
    const savedCode = localStorage.getItem(`lesson_${id}_code`);
    if (savedCode) {
        document.getElementById('code-editor').value = savedCode;
    }

    document.getElementById('run-btn').addEventListener('click', () => executeCode());
}

// Выполнение кода
async function executeCode() {
    if (!pyodide) return;
    const editor = document.getElementById('code-editor');
    const output = document.getElementById('console-output');
    const runBtn = document.getElementById('run-btn');
    
    const code = editor.value;
    output.textContent = '';
    runBtn.disabled = true;
    runBtn.textContent = '⏳ Выполняется...';

    // Перехват вывода print()
    let stdout = '';
    const oldPrint = pyodide.globals.get("print");
    pyodide.globals.set("print", (...args) => {
        const msg = args.map(String).join(' ');
        stdout += msg + '\n';
    });

    try {
        await pyodide.runPythonAsync(code);
        output.textContent = stdout || "Код выполнен без вывода.";
        output.style.color = "#00ff00";
    } catch (err) {
        output.textContent = "Ошибка:\n" + err.message;
        output.style.color = "#ff6b6b";
    } finally {
        // Возвращаем оригинальный print
        pyodide.globals.set("print", oldPrint);
        runBtn.disabled = false;
        runBtn.textContent = '▶️ Выполнить код';
        
        // Сохраняем код
        localStorage.setItem(`lesson_${currentLessonId}_code`, code);
    }
}

// Генерация боковой панели
function renderSidebar() {
    const list = document.getElementById('lesson-list');
    lessons.forEach(lesson => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = '#';
        a.textContent = `${lesson.id}. ${lesson.title}`;
        a.dataset.id = lesson.id;
        a.addEventListener('click', (e) => {
            e.preventDefault();
            currentLessonId = lesson.id;
            renderLesson(currentLessonId);
            closeSidebar();
        });
        li.appendChild(a);
        list.appendChild(li);
    });
}

// Мобильное меню
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('active');
}
function closeSidebar() {
    document.getElementById('sidebar').classList.remove('active');
}

// Инициализация
document.addEventListener('DOMContentLoaded', async () => {
    renderSidebar();
    await loadPyodide();
    renderLesson(currentLessonId);

    document.querySelector('.mobile-nav-toggle').addEventListener('click', toggleSidebar);
    window.addEventListener('resize', () => {
        if (window.innerWidth > 768) closeSidebar();
    });
});
</script>
</body>
</html>
