<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PythonCamp - Бесплатный курс Python</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-bg: #0a0a23;
            --secondary-bg: #1b1b32;
            --tertiary-bg: #2a2a40;
            --text-color: #dfdfe2;
            --highlight-color: #f1be32;
            --success-color: #acd157;
            --error-color: #ff6b6b;
            --border-color: #3b3b4f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background-color: var(--secondary-bg);
            padding: 1rem 2rem;
            border-bottom: 3px solid var(--highlight-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--highlight-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo-icon {
            font-size: 2rem;
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .progress-bar {
            width: 200px;
            height: 20px;
            background-color: var(--tertiary-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid var(--border-color);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--success-color), var(--highlight-color));
            transition: width 0.3s ease;
        }

        .progress-text {
            color: var(--text-color);
            font-weight: bold;
        }

        .container {
            display: grid;
            grid-template-columns: 300px 1fr;
            max-width: 1400px;
            margin: 0 auto;
            min-height: calc(100vh - 80px);
        }

        .sidebar {
            background-color: var(--secondary-bg);
            padding: 2rem 0;
            border-right: 2px solid var(--border-color);
            overflow-y: auto;
            max-height: calc(100vh - 80px);
            position: sticky;
            top: 80px;
        }

        .sidebar h2 {
            padding: 0 1.5rem 1rem;
            color: var(--highlight-color);
            font-size: 1.2rem;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 1rem;
        }

        .lesson-list {
            list-style: none;
        }

        .lesson-item {
            padding: 1rem 1.5rem;
            cursor: pointer;
            border-left: 4px solid transparent;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .lesson-item:hover {
            background-color: var(--tertiary-bg);
            border-left-color: var(--highlight-color);
        }

        .lesson-item.active {
            background-color: var(--tertiary-bg);
            border-left-color: var(--highlight-color);
            color: var(--highlight-color);
            font-weight: bold;
        }

        .lesson-item.completed {
            color: var(--success-color);
        }

        .lesson-icon {
            width: 24px;
            height: 24px;
            border: 2px solid currentColor;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .lesson-item.completed .lesson-icon {
            background-color: var(--success-color);
            color: var(--primary-bg);
            border-color: var(--success-color);
        }

        .main-content {
            padding: 2rem;
            overflow-y: auto;
        }

        .lesson-header {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
        }

        .lesson-title {
            font-size: 2rem;
            color: var(--highlight-color);
            margin-bottom: 0.5rem;
        }

        .lesson-description {
            color: var(--text-color);
            font-size: 1.1rem;
        }

        .lesson-content {
            margin-bottom: 2rem;
        }

        .lesson-content h3 {
            color: var(--highlight-color);
            margin: 1.5rem 0 1rem;
            font-size: 1.4rem;
        }

        .lesson-content p {
            margin-bottom: 1rem;
            line-height: 1.8;
        }

        .lesson-content ul, .lesson-content ol {
            margin: 1rem 0 1rem 2rem;
        }

        .lesson-content li {
            margin-bottom: 0.5rem;
        }

        .code-example {
            background-color: var(--secondary-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            margin: 1.5rem 0;
            overflow: hidden;
        }

        .code-example-header {
            background-color: var(--tertiary-bg);
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            color: var(--highlight-color);
            border-bottom: 1px solid var(--border-color);
        }

        .code-example pre {
            padding: 1rem;
            overflow-x: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .code-example code {
            color: var(--text-color);
        }

        .keyword { color: #c678dd; }
        .string { color: #98c379; }
        .number { color: #d19a66; }
        .comment { color: #5c6370; font-style: italic; }
        .function { color: #61afef; }
        .builtin { color: #e5c07b; }

        .task-box {
            background-color: var(--secondary-bg);
            border: 3px solid var(--highlight-color);
            border-radius: 8px;
            padding: 1.5rem;
            margin: 2rem 0;
        }

        .task-title {
            color: var(--highlight-color);
            font-size: 1.3rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .task-description {
            margin-bottom: 1rem;
            line-height: 1.8;
        }

        .code-editor {
            background-color: var(--primary-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            margin: 1rem 0;
            overflow: hidden;
        }

        .editor-header {
            background-color: var(--tertiary-bg);
            padding: 0.75rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
        }

        .editor-title {
            color: var(--highlight-color);
            font-weight: bold;
        }

        .editor-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            padding: 0.5rem 1.5rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .btn-run {
            background-color: var(--success-color);
            color: var(--primary-bg);
        }

        .btn-run:hover {
            background-color: #bcd66a;
            transform: translateY(-2px);
        }

        .btn-reset {
            background-color: var(--tertiary-bg);
            color: var(--text-color);
            border: 2px solid var(--border-color);
        }

        .btn-reset:hover {
            background-color: var(--border-color);
        }

        .btn-hint {
            background-color: var(--highlight-color);
            color: var(--primary-bg);
        }

        .btn-hint:hover {
            background-color: #f5cb42;
        }

        textarea {
            width: 100%;
            min-height: 200px;
            padding: 1rem;
            background-color: var(--primary-bg);
            color: var(--text-color);
            border: none;
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
            line-height: 1.5;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
        }

        .output-box {
            background-color: #000;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
            min-height: 100px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            overflow-x: auto;
        }

        .output-box.success {
            border-color: var(--success-color);
            color: var(--success-color);
        }

        .output-box.error {
            border-color: var(--error-color);
            color: var(--error-color);
        }

        .output-label {
            color: var(--highlight-color);
            font-weight: bold;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }

        .hint-box {
            background-color: rgba(241, 190, 50, 0.1);
            border-left: 4px solid var(--highlight-color);
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 4px;
        }

        .hint-box strong {
            color: var(--highlight-color);
        }

        .navigation-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 2px solid var(--border-color);
        }

        .btn-nav {
            padding: 0.75rem 2rem;
            background-color: var(--highlight-color);
            color: var(--primary-bg);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .btn-nav:hover {
            background-color: #f5cb42;
            transform: translateY(-2px);
        }

        .btn-nav:disabled {
            background-color: var(--tertiary-bg);
            color: var(--border-color);
            cursor: not-allowed;
            transform: none;
        }

        .welcome-screen {
            text-align: center;
            padding: 3rem 2rem;
        }

        .welcome-screen h1 {
            font-size: 3rem;
            color: var(--highlight-color);
            margin-bottom: 1rem;
        }

        .welcome-screen p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin: 3rem 0;
        }

        .feature-card {
            background-color: var(--secondary-bg);
            padding: 2rem;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            transition: all 0.3s;
        }

        .feature-card:hover {
            border-color: var(--highlight-color);
            transform: translateY(-5px);
        }

        .feature-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .feature-card h3 {
            color: var(--highlight-color);
            margin-bottom: 1rem;
        }

        .start-button {
            padding: 1rem 3rem;
            font-size: 1.2rem;
            background-color: var(--success-color);
            color: var(--primary-bg);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 2rem;
            transition: all 0.3s;
        }

        .start-button:hover {
            background-color: #bcd66a;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(172, 209, 87, 0.3);
        }

        .certificate {
            background: linear-gradient(135deg, var(--secondary-bg), var(--tertiary-bg));
            border: 5px solid var(--highlight-color);
            border-radius: 15px;
            padding: 3rem;
            text-align: center;
            margin: 2rem 0;
        }

        .certificate h2 {
            font-size: 2.5rem;
            color: var(--highlight-color);
            margin-bottom: 1rem;
        }

        .certificate-title {
            font-size: 1.5rem;
            color: var(--text-color);
            margin-bottom: 2rem;
        }

        .certificate-name {
            font-size: 2rem;
            color: var(--success-color);
            margin: 2rem 0;
            font-weight: bold;
        }

        .certificate-date {
            color: var(--text-color);
            margin-top: 2rem;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(10, 10, 35, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid var(--border-color);
            border-top-color: var(--highlight-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 1.5rem;
            font-size: 1.2rem;
            color: var(--highlight-color);
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: relative;
                top: 0;
                max-height: none;
                border-right: none;
                border-bottom: 2px solid var(--border-color);
            }

            .header-content {
                flex-direction: column;
                gap: 1rem;
            }

            .progress-bar {
                width: 150px;
            }
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--primary-bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--highlight-color);
        }
    </style>
</head>
<body>
    <div id="loading" class="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text">Загрузка Python...</div>
    </div>

    <header>
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">🐍</span>
                <span>PythonCamp</span>
            </div>
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span class="progress-text" id="progressText">0%</span>
            </div>
        </div>
    </header>

    <div class="container">
        <aside class="sidebar">
            <h2>📚 Курс Python</h2>
            <ul class="lesson-list" id="lessonList"></ul>
        </aside>

        <main class="main-content" id="mainContent">
            <!-- Контент урока будет загружаться динамически -->
        </main>
    </div>

    <script>
        // Глобальные переменные
        let pyodide = null;
        let currentLesson = 0;
        let completedLessons = new Set();

        // Загрузка прогресса из localStorage
        function loadProgress() {
            const saved = localStorage.getItem('pythoncamp_progress');
            if (saved) {
                completedLessons = new Set(JSON.parse(saved));
            }
        }

        // Сохранение прогресса
        function saveProgress() {
            localStorage.setItem('pythoncamp_progress', JSON.stringify([...completedLessons]));
        }

        // Инициализация Pyodide
        async function initPyodide() {
            try {
                pyodide = await loadPyodide();
                document.getElementById('loading').style.display = 'none';
                loadProgress();
                renderLessonList();
                renderWelcomeScreen();
                updateProgress();
            } catch (error) {
                document.getElementById('loading').innerHTML = `
                    <div style="color: #ff6b6b; text-align: center; padding: 2rem;">
                        <h2>Ошибка загрузки</h2>
                        <p>Не удалось загрузить Python. Проверьте подключение к интернету.</p>
                        <button onclick="location.reload()" class="btn btn-run" style="margin-top: 1rem;">Попробовать снова</button>
                    </div>
                `;
            }
        }

        // Данные уроков
        const lessons = [
            {
                id: 0,
                title: "Введение в Python",
                description: "Знакомство с языком программирования Python",
                content: `
                    <h3>Что такое Python?</h3>
                    <p>Python — это высокоуровневый язык программирования общего назначения, созданный Гвидо ван Россумом в 1991 году. Он известен своим простым и читаемым синтаксисом.</p>
                    
                    <h3>Почему Python?</h3>
                    <ul>
                        <li><strong>Простой синтаксис</strong> — код легко читать и писать</li>
                        <li><strong>Универсальность</strong> — веб-разработка, data science, AI, автоматизация</li>
                        <li><strong>Огромное сообщество</strong> — тысячи библиотек и ресурсов</li>
                        <li><strong>Востребованность</strong> — один из самых популярных языков в мире</li>
                    </ul>

                    <h3>Ваша первая программа</h3>
                    <p>Традиционно изучение любого языка начинается с программы "Hello, World!". В Python это делается очень просто:</p>
                    
                    <div class="code-example">
                        <div class="code-example-header">Пример кода</div>
                        <pre><code><span class="builtin">print</span>(<span class="string">"Hello, World!"</span>)</code></pre>
                    </div>

                    <p>Функция <code>print()</code> выводит текст на экран. Текст заключается в кавычки (одинарные или двойные).</p>
                `,
                task: {
                    title: "Задание 1: Привет, мир!",
                    description: "Выведите на экран фразу <strong>\"Hello, World!\"</strong> (именно так, с заглавных букв и с восклицательным знаком).",
                    starterCode: '# Напишите ваш код здесь\n',
                    solution: 'print("Hello, World!")',
                    hint: "Используйте функцию print() и заключите текст в кавычки.",
                    check: (output) => output.trim() === "Hello, World!"
                }
            },
            {
                id: 1,
                title: "Переменные и типы данных",
                description: "Изучаем переменные и основные типы данных",
                content: `
                    <h3>Что такое переменные?</h3>
                    <p>Переменная — это именованная область памяти, которая хранит данные. В Python не нужно указывать тип переменной — он определяется автоматически.</p>

                    <div class="code-example">
                        <div class="code-example-header">Пример кода</div>
                        <pre><code>name = <span class="string">"Алиса"</span>      <span class="comment"># строка (str)</span>
age = <span class="number">25</span>             <span class="comment"># целое число (int)</span>
height = <span class="number">1.68</span>        <span class="comment"># дробное число (float)</span>
is_student = <span class="keyword">True</span>    <span class="comment"># логический тип (bool)</span></code></pre>
                    </div>

                    <h3>Основные типы данных</h3>
                    <ul>
                        <li><strong>int</strong> — целые числа: 42, -7, 0</li>
                        <li><strong>float</strong> — дробные числа: 3.14, -0.5, 2.0</li>
                        <li><strong>str</strong> — строки: "привет", 'мир'</li>
                        <li><strong>bool</strong> — логические значения: True, False</li>
                    </ul>

                    <h3>Проверка типа</h3>
                    <p>Чтобы узнать тип переменной, используйте функцию <code>type()</code>:</p>

                    <div class="code-example">
                        <div class="code-example-header">Пример кода</div>
                        <pre><code>x = <span class="number">42</span>
<span class="builtin">print</span>(<span class="builtin">type</span>(x))  <span class="comment"># &lt;class 'int'&gt;</span>

y = <span class="string">"Привет"</span>
<span class="builtin">print</span>(<span class="builtin">type</span>(y))  <span class="comment"># &lt;class 'str'&gt;</span></code></pre>
                    </div>
                `,
                task: {
                    title: "Задание 2: Типы данных",
                    description: "Создайте переменную <code>year</code> со значением <strong>2024</strong> и выведите её тип с помощью функции <code>type()</code>.",
                    starterCode: '# Создайте переменную year\n# Выведите её тип\n',
                    solution: 'year = 2024\nprint(type(year))',
                    hint: "Создайте переменную: year = 2024, затем используйте print(type(year))",
                    check: (output) => output.includes("int")
                }
            },
            {
                id: 2,
                title: "Операторы",
                description: "Арифметические и логические операторы",
                content: `
                    <h3>Арифметические операторы</h3>
                    <p>Python поддерживает все стандартные математические операции:</p>

                    <div class="code-example">
                        <div class="code-example-header">Пример кода</div>
                        <pre><code>a = <span class="number">10</span>
b = <span class="number">3</span>

<span class="builtin">print</span>(a + b)   <span class="comment"># Сложение: 13</span>
<span class="builtin">print</span>(a - b)   <span class="comment"># Вычитание: 7</span>
<span class="builtin">print</span>(a * b)   <span class="comment"># Умножение: 30</span>
<span class="builtin">print</span>(a / b)   <span class="comment"># Деление: 3.333...</span>
<span class="builtin">print</span>(a // b)  <span class="comment"># Целочисленное деление: 3</span>
<span class="builtin">print</span>(a % b)   <span class="comment"># Остаток от деления: 1</span>
<span class="builtin">print</span>(a ** b)  <span class="comment"># Возведение в степень: 1000</span></code></pre>
                    </div>

                    <h3>Операторы сравнения</h3>
                    <div class="code-example">
                        <div class="code-example-header">Пример кода</div>
                        <pre><code>x = <span class="number">5</span>
y = <span class="number">10</span>

<span class="builtin">print</span>(x == y)  <span class="comment"># Равно: False</span>
<span class="builtin">print</span>(x != y)  <span class="comment"># Не равно: True</span>
<span class="builtin">print</span>(x > y)   <span class="comment"># Больше: False</span>
<span class="builtin">print</span>(x < y)   <span class="comment"># Меньше: True</span>
<span class="builtin">print</span>(x >= <span class="number">5</span>)  <span class="comment"># Больше или равно: True</span></code></pre>
                    </div>

                    <h3>Логические операторы</h3>
                    <div class="code-example">
                        <div class="code-example-header">Пример кода</div>
